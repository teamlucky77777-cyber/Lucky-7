async function addRecruitFull(){
  try{
    const n=document.getElementById('nr-n').value.trim();if(!n)return;
  const sip=document.getElementById('nr-sip').value;
  const lan=document.getElementById('nr-lan').value;
  const base={name:n,source:document.getElementById('nr-s').value,date_applied:document.getElementById('nr-d').value,stage:'Applied'};
  const full={...base,cpu:document.getElementById('nr-cpu').value,gpu:document.getElementById('nr-gpu').value,ram:document.getElementById('nr-ram').value,ssd:document.getElementById('nr-ssd').value,speed:document.getElementById('nr-spd').value,os:document.getElementById('nr-os').value,static_ip:sip===''?null:sip==='yes',lan_cable:lan===''?null:lan==='yes'};
  let {data,error}=await sb.from('recruits').insert(full).select().single();
  if(error){({data,error}=await sb.from('recruits').insert(base).select().single());}
  if(error){toast(error.message,'err');console.error(error);return;}
  if(data){S.recruits.push(data);toast('Applicant added ✓');}
  S.showAddRecruit=false;render();
  }catch(e){toast('Error: '+e.message,'err');console.error('[addRecruitFull]',e);}
}
async function saveRequirements(){
  try{
    const newReqs={
      os_label:document.getElementById('rq-os').value.trim()||'Windows 10/11',
      min_intel_gen:parseInt(document.getElementById('rq-intel').value)||8,
      min_ryzen_gen:parseInt(document.getElementById('rq-ryzen').value)||3,
      gpu_label:document.getElementById('rq-gpu').value.trim()||'GTX 1050 Ti+ / RX 560+',
      min_ram:parseInt(document.getElementById('rq-ram').value)||8,
      min_speed:parseInt(document.getElementById('rq-spd').value)||70,
      require_static_ip:document.getElementById('rq-ip').value==='yes',
      require_lan_cable:document.getElementById('rq-lan').value==='yes',
      require_ssd:document.getElementById('rq-ssd').value==='yes'
    };
    const {error}=await sb.from('app_settings').upsert({key:'recruit_requirements',value:newReqs,updated_at:new Date().toISOString(),updated_by:S.user?.id},{onConflict:'key'});
    if(error){toast(error.message,'err');console.error(error);return;}
    S.recruitReqs=newReqs;
    S.showEditReqs=false;
    toast('Requirements updated ✓');
    render();
  }catch(e){toast('Error: '+e.message,'err');console.error('[saveRequirements]',e);}
}

function mondayOf(d){const dt=new Date(d);dt.setHours(0,0,0,0);const day=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-day);return dt;}
function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function changeRosterWeek(delta){const m=S.rosterWeek?new Date(S.rosterWeek+'T00:00:00'):mondayOf(new Date());m.setDate(m.getDate()+delta*7);S.rosterWeek=isoDate(m);render();}
async function setShift(opId,opName,dateStr,current){
  if(!can('roster_edit'))return;
  const order=['','Morning','Day','Night'];
  const next=order[(order.indexOf(current||'')+1)%order.length];
  try{
    if(next===''){
      await sb.from('shift_roster').delete().eq('operator_id',opId).eq('shift_date',dateStr);
      S.roster=S.roster.filter(r=>!(r.operator_id===opId&&r.shift_date===dateStr));
    }else{
      const rec={operator_id:opId,operator_name:opName,shift_date:dateStr,shift_type:next};
      const {data,error}=await sb.from('shift_roster').upsert(rec,{onConflict:'operator_id,shift_date'}).select().single();
      if(error){if(/shift_roster|permission|schema|could not find|relation/i.test(error.message)){alert('Shift Roster needs database setup. Run the SQL provided.\n\n'+error.message);}else toast(error.message,'err');console.error(error);return;}
      S.roster=S.roster.filter(r=>!(r.operator_id===opId&&r.shift_date===dateStr));
      if(data)S.roster.push(data);
    }
    render();
  }catch(e){toast('Error: '+e.message,'err');console.error('[setShift]',e);}
}
function pgRoster(){
  const ko=S.lang==='ko';

  const days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d;});
  const dayNames=ko?['월','화','수','목','금','토','일']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const todayIso=isoDate(new Date());
  const SH={Morning:['rgba(224,149,74,.18)','#e0954a','🌅',ko?'오전':'Morning'],Day:['rgba(90,155,212,.18)','#5fa3d9','☀️',ko?'주간':'Day'],Night:['rgba(154,125,196,.20)','#a98fd6','🌙',ko?'야간':'Night']};
  const get=(opId,dIso)=>S.roster.find(r=>r.operator_id===opId&&r.shift_date===dIso);
  // operators = team members (everyone schedulable)

      const inner=who.length?who.map(w=>esc((w.operator_name||'').split(' ')[0])).join(', '):'<span style="color:var(--re)">⚠ '+(ko?'없음':'none')+'</span>';

    }).join('')+'</tr>';

  const head='<tr><th>'+(S.rosterView==='operator'?(ko?'운영자':'Operator'):(ko?'시프트':'Shift'))+'</th>'+days.map((d,i)=>'<th style="text-align:center'+(isoDate(d)===todayIso?';color:var(--ac-strong)':'')+'">'+dayNames[i]+'<div style="font-size:10px;color:var(--tx3);font-weight:400">'+(d.getMonth()+1)+'/'+d.getDate()+'</div></th>').join('')+'</tr>';

  const weekLabel=mon.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+days[6].toLocaleDateString('en-US',{month:'short',day:'numeric'});

  return '<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px"><div>'
    +'<div style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.14em;font-weight:500;margin-bottom:8px">'+(ko?'운영':'Operations')+'</div>'

      +'<button onclick="S.rosterView=\'coverage\';render()" style="padding:7px 14px;font-size:12px;font-weight:500;border:none;cursor:pointer;background:'+(S.rosterView==='coverage'?'var(--tx)':'transparent')+';color:'+(S.rosterView==='coverage'?'var(--bg)':'var(--tx2)')+'">'+(ko?'커버리지':'Coverage')+'</button>'

}

function hhmmParts(t){const m=String(t||'').match(/(\d{1,2}):(\d{2})/);return m?[String(+m[1]).padStart(2,'0'),m[2]]:['',''];}
function hourOpts(selV,maxH){let o='<option value="">--</option>';for(let h=0;h<=maxH;h++){const v=String(h).padStart(2,'0');o+='<option value="'+v+'"'+(v===selV?' selected':'')+'>'+v+'</option>';}return o;}
function minOpts(selV){return ['00','15','30','45'].map(m=>'<option value="'+m+'"'+(m===selV?' selected':'')+'>'+m+'</option>').join('');}
function schedRowHTML(start,end,name){
  const sp=hhmmParts(start),ep=hhmmParts(end);
  const ss='width:70px;padding:7px 6px;border:1px solid var(--br2);border-radius:6px;background:var(--bg-i);color:var(--tx);font-family:inherit;font-size:12px;color-scheme:dark';
  const T=(cls,h,m,maxH)=>'<select class="'+cls+'-h" style="'+ss+'">'+hourOpts(h,maxH)+'</select><span style="color:var(--tx3)">:</span><select class="'+cls+'-m" style="'+ss+'">'+minOpts(m||'00')+'</select>';
  return '<div class="sched-row" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px">'
    +T('sr-s',sp[0],sp[1],23)
    +'<span style="color:var(--tx3)">~</span>'
    +T('sr-e',ep[0],ep[1],24)
    +'<span style="color:var(--tx3)">\u2192</span>'
    +'<input type="text" class="sr-name" value="'+String(name||'').replace(/"/g,"&quot;")+'" placeholder="'+(S.lang==='ko'?'\uc9c1\uc6d0 \uc774\ub984':'staff name')+'" style="flex:1;min-width:140px;padding:7px 11px;border:1px solid var(--br2);border-radius:6px;background:var(--bg-i);color:var(--tx);font-family:inherit;font-size:12px">'
    +'<button onclick="this.closest(\'.sched-row\').remove()" style="flex:none;background:none;border:none;color:var(--tx3);cursor:pointer;font-size:18px;line-height:1;padding:0 6px" title="remove">\u00d7</button>'
    +'</div>';
}
function schedToRows(text){
  const lines=String(text||'').split(/\n+/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return schedRowHTML('','','');
  return lines.map(l=>{const times=l.match(/(\d{1,2}:\d{2})/g)||[];const name=(l.split(/[\u2192|]/).pop()||'').trim();return schedRowHTML(times[0]||'',times[1]||'',name);}).join('');
}
function addSchedRow(){const c=document.getElementById('sched-rows');if(!c)return;const t=document.createElement('template');t.innerHTML=schedRowHTML('','','');c.appendChild(t.content.firstChild);}
function readSchedRows(){
  const c=document.getElementById('sched-rows');if(!c)return null;
  const out=[...c.querySelectorAll('.sched-row')].map(r=>{
    const sh=r.querySelector('.sr-s-h').value,sm=r.querySelector('.sr-s-m').value,eh=r.querySelector('.sr-e-h').value,em=r.querySelector('.sr-e-m').value,n=r.querySelector('.sr-name').value.trim();
    const start=sh?sh+':'+(sm||'00'):'';const end=eh?eh+':'+(em||'00'):'';
    if(!n&&!start&&!end)return null;const time=start+(end?'~'+end:'');return (time?time+' \u2192 ':'')+n;
  }).filter(Boolean);
  return out.join('\n')||null;
}

async function saveGamePC(id){

}

function reqExp(L){return Math.round(74465*Math.pow(1.204,L-26));}
function cumExp(level,pct){level=Math.max(1,Math.round(level)||1);let s=0;for(let L=1;L<level;L++)s+=reqExp(L);return s+(Math.max(0,Math.min(100,pct))/100)*reqExp(level);}
const EXP_LOGS_SQL="create table if not exists exp_logs (\n  id uuid primary key default gen_random_uuid(),\n  account text not null,\n  level int not null default 1,\n  exp_pct numeric not null default 0,\n  log_date date not null default current_date,\n  created_at timestamptz default now(),\n  created_by uuid\n);\ngrant all on exp_logs to authenticated;";
function calcResultHTML(baseExp,kph,hours,lvl0,pct0,monLv,measuredPctPerHr){
  const ko=S.lang==='ko';const fmt=n=>Math.round(n).toLocaleString();
  lvl0=Math.max(1,Math.round(lvl0)||1);pct0=Math.min(100,Math.max(0,pct0));
  const calibrated=measuredPctPerHr>0;
  const expHr=calibrated?(measuredPctPerHr/100)*reqExp(lvl0):baseExp*kph;
  const total=expHr*hours;
  let lvl=lvl0,pool=(pct0/100)*reqExp(lvl)+total,g=0;
  while(pool>=reqExp(lvl)&&g<800){pool-=reqExp(lvl);lvl++;g++;}
  const endPct=Math.min(100,pool/reqExp(lvl)*100);
  const sessPct=reqExp(lvl0)>0?total/reqExp(lvl0)*100:0;
  const pctPerHr=hours>0?sessPct/hours:0;
  const hToNext=pctPerHr>0?(100-pct0)/pctPerHr:0;
  const M=(l,v,c)=>'<div><div style="font-size:11px;color:var(--tx3)">'+l+'</div><div style="font-size:19px;font-weight:700;color:'+c+'">'+v+'</div></div>';
  const gap=monLv>0?lvl0-monLv:0;
  let warn='';
  if(!calibrated&&gap>5){warn='<div style="margin-top:12px;padding:10px 12px;background:rgba(217,148,58,.12);border:1px solid rgba(217,148,58,.4);border-radius:8px;font-size:11px;color:var(--warn,#d9943a);line-height:1.6">'+(ko?'⚠ 캐릭터가 이 몬스터보다 '+gap+'레벨 높습니다. 실제 EXP는 레벨 페널티로 위 수치보다 훨씬 적습니다. 정확히 보려면 아래 "세션 보정"에 보고서 % 두 개를 입력하세요.':'⚠ You are '+gap+' levels above this monster — real EXP is far lower than shown (over-level penalty). For accuracy, fill in "Session calibration" below using two report %s.')+'</div>';}
  else if(calibrated){warn='<div style="margin-top:12px;font-size:11px;color:#5fae7a">'+(ko?'✓ 세션 보고서 실측치로 계산됨 ('+measuredPctPerHr.toFixed(4)+'%/시간 · '+fmt(expHr)+' EXP/시간)':'✓ Based on your session report ('+measuredPctPerHr.toFixed(4)+'%/hr · '+fmt(expHr)+' EXP/hr)')+'</div>';}
  const nextNote=(pctPerHr>0&&hToNext>0)?'<div style="margin-top:10px;padding:9px 12px;background:rgba(95,174,122,.1);border-radius:8px;font-size:12px;color:#5fae7a">'+(ko?'⏱ 이 속도면 약 '+hToNext.toFixed(1)+'시간 후 Lv.'+(lvl0+1)+' 도달':'⏱ ≈ '+hToNext.toFixed(1)+'h to reach Lv.'+(lvl0+1)+' at this rate')+'</div>':'';
  return '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px">'
    +(calibrated?M(ko?'측정 %/시간':'Measured %/hr',measuredPctPerHr.toFixed(4)+'%','var(--ac-strong)'):M(ko?'총 처치':'Total kills',fmt(kph*hours),'var(--ac-strong)'))
    +M(ko?'시간당 EXP':'EXP / hour',fmt(expHr),'var(--ac-strong)')
    +M(ko?'총 EXP':'Total EXP',fmt(total),'#5fae7a')
  +'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid var(--br);padding-top:14px">'
    +M(ko?'획득 %':'% gained','+'+sessPct.toFixed(4)+'%','#5fae7a')
    +M(ko?'도달':'Ends at','Lv.'+lvl+' · '+endPct.toFixed(4)+'%','#5fae7a')
  +'</div>'+nextNote+(g>0?'<div style="font-size:11px;color:var(--tx3);margin-top:8px">'+(ko?'설정 시간 동안 약 '+g+'레벨 상승':'≈ '+g+' level'+(g>1?'s':'')+' over the planned time')+'</div>':'')+warn;
}
function calcGameExp(){
  const g=id=>parseFloat((document.getElementById(id)||{}).value)||0;
  const r=document.getElementById('calc-result');if(!r)return;
  const ss=g('calc-sess-start'),se=g('calc-sess-end'),sh=g('calc-sess-hours');
  let measured=0;if(se>ss&&sh>0)measured=(se-ss)/sh;
  r.innerHTML=calcResultHTML(g('calc-exp'),g('calc-kph'),g('calc-hours'),g('calc-lvl'),g('calc-pct'),g('calc-mon-lv'),measured);
}
async function addExpLog(){
  const acc=document.getElementById('el-acc'),lvl=document.getElementById('el-lvl'),pct=document.getElementById('el-pct'),dt=document.getElementById('el-date');
  if(!acc||!acc.value.trim()){toast(S.lang==='ko'?'계정 이름을 입력하세요':'Enter an account name','err');return;}
  const row={account:acc.value.trim(),level:parseInt(lvl&&lvl.value)||1,exp_pct:parseFloat(pct&&pct.value)||0,log_date:(dt&&dt.value)||new Date().toISOString().slice(0,10),created_by:S.user&&S.user.id};
  try{
    const {data,error}=await sb.from('exp_logs').insert(row).select().single();
    if(error){if(/exist|relation|42P01|schema|could not find/i.test(error.message)){alert((S.lang==='ko'?'exp_logs 테이블이 없습니다. Supabase SQL 편집기에서 아래를 실행하세요:\n\n':'The exp_logs table is missing. Run this in your Supabase SQL editor:\n\n')+EXP_LOGS_SQL);}else toast(error.message,'err');console.error(error);return;}
    S.expLogs=(S.expLogs||[]).concat(data);
    if(pct)pct.value='';
    toast(S.lang==='ko'?'기록됨 ✓':'Logged ✓');render();
  }catch(e){toast('Error: '+e.message,'err');}
}
async function delExpLog(id){
  if(!confirm(S.lang==='ko'?'이 기록을 삭제할까요?':'Delete this entry?'))return;
  const {error}=await sb.from('exp_logs').delete().eq('id',id);
  if(error){toast(error.message,'err');console.error(error);return;}
  S.expLogs=(S.expLogs||[]).filter(e=>e.id!==id);toast(S.lang==='ko'?'삭제됨':'Deleted');render();
}
function setExpTarget(v){S.expTarget=parseInt(v)||30;render();}
function calcMonSearch(){
  const q=((document.getElementById('calc-mon-search')||{}).value||'').toLowerCase();
  const box=document.getElementById('calc-mon-list');if(!box)return;
  const ko=S.lang==='ko';
  if(!q){box.style.display='none';box.innerHTML='';return;}
  const score=m=>{const en=m.en.toLowerCase(),kr=m.kr.toLowerCase();if(en.startsWith(q)||kr.startsWith(q))return 2;if(en.split(/\s+/).some(w=>w.startsWith(q))||kr.split(/\s+/).some(w=>w.startsWith(q)))return 1;return 0;};
  const matches=LINEAGE_MONSTERS.map(m=>({m:m,s:score(m)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||a.m.lv-b.m.lv).slice(0,40).map(x=>x.m);
  if(!matches.length){box.innerHTML='<div style="padding:8px 12px;font-size:12px;color:var(--tx3)">'+(ko?'결과 없음':'No match')+'</div>';box.style.display='block';return;}
  box.innerHTML=matches.map(m=>{const nm=(ko?m.kr:m.en).replace(/'/g,'');const lbl=nm+' · Lv.'+m.lv;return '<div onmousedown="pickCalcMon('+m.exp+','+m.lv+',\''+lbl+'\')" style="padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--br)">'+(m.boss?'<span style=\'color:#e0584f\'>★ </span>':'')+esc(ko?m.kr:m.en)+' <span style=\'color:var(--tx3);font-size:11px\'>Lv.'+m.lv+' · '+m.exp.toLocaleString()+' EXP</span></div>';}).join('');
  box.style.display='block';
}
function pickCalcMon(exp,lv,label){
  const s=document.getElementById('calc-mon-search');if(s)s.value=label;
  const e=document.getElementById('calc-exp');if(e)e.value=exp;
  const lvEl=document.getElementById('calc-mon-lv');if(lvEl)lvEl.value=lv;
  const box=document.getElementById('calc-mon-list');if(box){box.style.display='none';box.innerHTML='';}
  calcGameExp();
}
let MON_SORT={col:'lv',dir:1};
let MON_LOC='';
function _monZones(){const z={};LINEAGE_MONSTERS.forEach(m=>m.zones.forEach(x=>{z[x.en]=x;}));return Object.keys(z).sort().map(k=>z[k]);}
function locSearch(){
  const q=((document.getElementById('mon-loc-search')||{}).value||'').toLowerCase();
  const box=document.getElementById('mon-loc-list');if(!box)return;
  const ko=S.lang==='ko';
  let zs=_monZones();if(q)zs=zs.filter(z=>(z.en+' '+z.kr).toLowerCase().indexOf(q)>=0);
  let html='<div onmousedown="pickLoc(\'\',\''+(ko?'전체 지역':'All locations')+'\')" style="padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--br);color:var(--tx2)">'+(ko?'전체 지역':'All locations')+'</div>';
  html+=zs.slice(0,60).map(z=>{const nm=(ko?z.kr:z.en).replace(/'/g,'');return '<div onmousedown="pickLoc(\''+z.en.toLowerCase().replace(/'/g,'')+'\',\''+nm+'\')" style="padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--br)">'+esc(ko?z.kr:z.en)+'</div>';}).join('');

function pickLoc(key,label){MON_LOC=key;const s=document.getElementById('mon-loc-search');if(s)s.value=label;const box=document.getElementById('mon-loc-list');if(box)box.style.display='none';applyMonFilters();}
function _mval(id){const e=document.getElementById(id);return e?e.value:'';}
function toggleZone(head){const body=head.nextElementSibling;const chev=head.querySelector('.zone-chev');const open=body.style.display==='none';body.style.display=open?'block':'none';if(chev)chev.textContent=open?'▼':'▶';}
function applyMonFilters(){
  const q=_mval('mon-search').toLowerCase();
  const type=_mval('mon-type');
  const filtering=!!(q||type);
  let total=0;
  document.querySelectorAll('.mon-zone').forEach(zone=>{
    const body=zone.querySelector('.mon-zone-body');
    const chev=zone.querySelector('.zone-chev');
    let vis=0;
    zone.querySelectorAll('tbody tr').forEach(tr=>{
      const name=tr.getAttribute('data-name')||'';const boss=tr.getAttribute('data-boss')==='1';
      let show=true;
      if(q && name.indexOf(q)<0)show=false;
      if(type==='boss'&&!boss)show=false;
      if(type==='normal'&&boss)show=false;
      tr.style.display=show?'':'none';if(show)vis++;
    });
    if(vis===0){zone.style.display='none';}
    else{zone.style.display='';total+=vis;if(filtering){body.style.display='block';if(chev)chev.textContent='▼';}}
  });
  const c=document.getElementById('mon-count');if(c)c.textContent=total+(S.lang==='ko'?'종':' monsters');
}
function _unusedSortMon(col){
  if(MON_SORT.col===col)MON_SORT.dir*=-1;else{MON_SORT.col=col;MON_SORT.dir=1;}
  const tb=document.getElementById('mon-tbody');if(!tb)return;
  const numeric=['lv','hp','mp','ac','mr','exp'].indexOf(col)>=0;
  const rows=Array.prototype.slice.call(tb.children);
  rows.sort((a,b)=>{let av=a.getAttribute('data-'+col)||'',bv=b.getAttribute('data-'+col)||'';if(numeric)return ((parseFloat(av)||0)-(parseFloat(bv)||0))*MON_SORT.dir;return av.localeCompare(bv)*MON_SORT.dir;});
  rows.forEach(r=>tb.appendChild(r));
  document.querySelectorAll('#mon-thead th[data-col]').forEach(th=>{const c=th.getAttribute('data-col');const a=th.querySelector('.arr');if(a)a.textContent=c===col?(MON_SORT.dir===1?' ▲':' ▼'):'';});
}

// ===== SCHEDULE SYSTEM =====
function schedState(){
  if(!S.sched||typeof S.sched!=='object')S.sched={};
  const d=S.sched;
  if(!Array.isArray(d.remotes)||!d.remotes.length)d.remotes=['TeamLucky7','TeamLucky77'];
  if(!Array.isArray(d.games)||!d.games.length)d.games=[{key:'lin',name_en:'Lineage Classic',name_ko:'리니지 클래식',color:'#d96a64'},{key:'map',name_en:'MapleStory Planet',name_ko:'메이플 플래닛',color:'#5fae7a'}];
  if(!Array.isArray(d.zones))d.zones=['Orc Forest','NPC > 2 > 1','NPC > 2 > 2'];
  if(typeof d.webhook!=='string')d.webhook='';
  if(!d.pcs||typeof d.pcs!=='object')d.pcs={};
  d.remotes.forEach(r=>{if(!Array.isArray(d.pcs[r]))d.pcs[r]=[];});
  if(!d.cur||d.remotes.indexOf(d.cur)<0)d.cur=d.remotes[0]||'';
  return d;
}
async function saveSched(){
  try{const {error}=await sb.from('app_settings').upsert({key:'schedule',value:S.sched,updated_at:new Date().toISOString(),updated_by:S.user&&S.user.id},{onConflict:'key'});if(error){toast(error.message,'err');console.error(error);}}catch(e){console.error('[saveSched]',e);}
}
function schSave(){saveSched();render();}
function schSwitch(v){schedState().cur=v;render();}
function schAddRemote(){const d=schedState();const n=prompt(S.lang==='ko'?'새 Remote T ID:':'New Remote T ID:');if(!n)return;const v=n.trim();if(!v||d.remotes.indexOf(v)>=0)return;d.remotes.push(v);d.pcs[v]=[];d.cur=v;schSave();}
function schDelRemote(){const d=schedState();if(d.remotes.length<=1){toast(S.lang==='ko'?'최소 1개는 있어야 합니다':'Need at least one','err');return;}if(!confirm((S.lang==='ko'?'이 Remote T 삭제: ':'Delete Remote T: ')+d.cur+'?'))return;const i=d.remotes.indexOf(d.cur);delete d.pcs[d.cur];d.remotes.splice(i,1);d.cur=d.remotes[0];schSave();}
function pgSchedule(){
  const ko=S.lang==='ko';
  const canEdit=can('schedule_edit');
  if(!S.schedWeek) S.schedWeek=isoDate(mondayOf(new Date()));
  const wk=S.schedWeek;
  const mon=new Date(wk+'T00:00:00');
  const sun=new Date(mon); sun.setDate(sun.getDate()+6);
  const fmt=x=>x.toLocaleDateString(ko?'ko-KR':'en-US',{month:'short',day:'numeric'});
  const wkLabel=fmt(mon)+' – '+fmt(sun);
  const days=ko?['월','화','수','목','금','토','일']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const dates=Array.from({length:7},(_,i)=>{const dd=new Date(mon);dd.setDate(dd.getDate()+i);return dd.getDate();});
  const ops=(S.team||[]).filter(m=>m.role&&m.role!=='pending').sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const gameClass=g=>g==='Lineage'?'g-lin':g==='Maple'?'g-map':'';
  const weekShifts=S.shifts.filter(s=>s.week_start===wk);

  const cellChips=(dow,shift,pcId,clientId)=>{
    let list=weekShifts.filter(s=>s.dow===dow&&s.shift_type===shift);
    if(pcId!==undefined&&pcId!==null) list=list.filter(s=>s.pc_id===pcId);
    if(clientId!==undefined&&clientId!==null) list=list.filter(s=>s.client_id===clientId);
    if(!list.length)return '<span class="sh-empty">'+(ko?'비어있음':'empty')+'</span>';
    return list.map(s=>{
      const gc=gameClass(s.game);
      const nm=esc(s.operator_name||'?');
      // Context-aware tags: show PC tag in Shift+Client views (when row isn't the PC), Client tag in Shift+PC views
      const showPCTag=(S.schedView==='shift'||S.schedView==='client')&&s.pc_num;
      const showCliTag=(S.schedView==='shift'||S.schedView==='pc')&&s.client_name;
      const pcTag=showPCTag?'<span style="font-size:9px;font-weight:600;background:var(--bg-a);color:var(--tx3);padding:1px 5px;border-radius:3px;margin-right:2px">PC-'+esc(s.pc_num)+'</span>':'';
      const cliTag=showCliTag?'<span style="font-size:9px;font-weight:600;background:var(--ac-bg);color:var(--ac);padding:1px 5px;border-radius:3px;margin-right:2px" title="'+(ko?'클라이언트':'Client')+'">'+esc(s.client_name)+'</span>':'';
      if(!canEdit)return '<span class="sh-chip '+gc+'">'+pcTag+cliTag+nm+'</span>';
      return '<span class="sh-chip '+gc+'">'
        +'<span class="sh-gdot '+gc+'" title="'+(ko?'게임 변경':'cycle game')+'" onclick="schedCycleGame(event,'+s.id+')"></span>'
        +pcTag+cliTag+nm
        +'<span class="sh-x" title="'+(ko?'제거':'remove')+'" onclick="schedRemove(event,'+s.id+')">✕</span>'
        +'</span>';
    }).join('');
  };

  // View toggle
  const viewToggle='<div style="display:inline-flex;border:1px solid var(--br);border-radius:8px;overflow:hidden;margin-bottom:14px">'
    +'<button onclick="S.schedView=\'shift\';render()" style="padding:7px 16px;font-size:12px;font-weight:500;border:none;cursor:pointer;background:'+(S.schedView==='shift'?'var(--tx)':'transparent')+';color:'+(S.schedView==='shift'?'var(--bg)':'var(--tx2)')+'">'+(ko?'시프트':'Shift')+'</button>'
    +'<span style="width:1px;background:var(--br)"></span>'
    +'<button onclick="schedSetView(\'pc\')" style="padding:7px 16px;font-size:12px;font-weight:500;border:none;cursor:pointer;background:'+(S.schedView==='pc'?'var(--tx)':'transparent')+';color:'+(S.schedView==='pc'?'var(--bg)':'var(--tx2)')+'">PC</button>'
    +'<span style="width:1px;background:var(--br)"></span>'
    +'<button onclick="schedSetView(\'client\')" style="padding:7px 16px;font-size:12px;font-weight:500;border:none;cursor:pointer;background:'+(S.schedView==='client'?'var(--tx)':'transparent')+';color:'+(S.schedView==='client'?'var(--bg)':'var(--tx2)')+'">'+(ko?'클라이언트':'Client')+'</button>'
    +'</div>';

  // Day selector (shown in PC and Client views)
  let daySelector='';
  if(S.schedView==='pc' || S.schedView==='client'){
    if(S.schedDay===null||S.schedDay===undefined) S.schedDay=todayDow();
    const realToday=todayDow();
    const realWk=isoDate(mondayOf(new Date()));
    daySelector='<div style="display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap">'
      +'<span style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;margin-right:4px">'+(ko?'요일':'Day')+'</span>'
      +days.map((d,i)=>{
        const isSel=i===S.schedDay;
        const isToday=i===realToday&&S.schedWeek===realWk;
        const bg=isSel?'background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600':(isToday?'border-color:var(--ac);color:var(--ac)':'');

      +'</div>';
  }

  const pool=canEdit?('<div class="sh-pool"><span class="sh-pool-lbl">'+(ko?'운영자':'Operators')+'</span>'

  let grid='';
  if(S.schedView==='shift'){
    // Shift view: rows = days, cols = Day/Night
    grid='<div class="sh-grid">';
    grid+='<span></span><div class="sh-head day">☀ '+(ko?'주간':'Day')+'</div><div class="sh-head night">☾ '+(ko?'야간':'Night')+'</div>';

      grid+='<div class="sh-rowlbl">'+days[i]+'<small>'+dates[i]+'</small></div>'+cell(i,'Day')+cell(i,'Night');

    const cliList=(S.clients||[]).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    const canEditCli=can('clients');

    } else {
      const dy=S.schedDay;

async function schedBindClientPC(clientId,pcVal){
  if(!can('schedule_edit'))return;
  const pcId=pcVal?parseInt(pcVal):null;
  try{
    const {data,error}=await sb.from('clients').update({pc_id:pcId}).eq('id',clientId).select().single();
    if(error){toast(error.message,'err');console.error(error);return;}
    S.clients=S.clients.map(c=>c.id===clientId?data:c);
    const pc=pcId?(S.pcs||[]).find(p=>p.id===pcId):null;
    toast(pc?(S.lang==='ko'?'PC-'+String(pc.num).padStart(2,'0')+' 연결됨':'Linked to PC-'+String(pc.num).padStart(2,'0')):(S.lang==='ko'?'PC 연결 해제':'PC binding cleared'));
    render();
  }catch(e){toast('Error: '+e.message,'err');console.error(e);}
}
function currentShift(){const h=new Date().getHours(); return (h>=6&&h<18)?'Day':'Night';}
function todayDow(){return (new Date().getDay()+6)%7;}
function isLiveSlot(week_start,dow,shift_type){
  return week_start===isoDate(mondayOf(new Date())) && dow===todayDow() && shift_type===currentShift();
}
function schedWeekNav(delta){
  if(!S.schedWeek)S.schedWeek=isoDate(mondayOf(new Date()));
  if(delta===0){S.schedWeek=isoDate(mondayOf(new Date()));render();return;}
  const m=new Date(S.schedWeek+'T00:00:00');
  m.setDate(m.getDate()+delta*7);
  S.schedWeek=isoDate(m);render();
}
function schedDragStart(ev,id){

}
function schedDragOver(ev){

async function schedDrop(ev,dow,shift,pcId,clientId){
  ev.preventDefault();
  ev.currentTarget.classList.remove('dragover');
  if(!can('schedule_edit'))return;
  const id=S.schedDrag; S.schedDrag=null;
  if(!id)return;
  const m=(S.team||[]).find(x=>x.id===id);
  const name=m?m.name:'?';
  const wk=S.schedWeek;
  // View context — PC view sets pcId, Client view sets clientId
  const inPCView=pcId!==null&&pcId!==undefined;
  const inClientView=clientId!==null&&clientId!==undefined;
  const client=inClientView?(S.clients||[]).find(c=>c.id===clientId):null;
  const clientName=client?client.name:null;
  // Resolve effective PC: explicit (PC view) wins; otherwise inherit from client binding
  let effPcId=inPCView?pcId:(inClientView&&client&&client.pc_id?client.pc_id:null);
  let effPcNum=null;
  if(effPcId){
    const p=(S.pcs||[]).find(x=>x.id===effPcId);
    if(p) effPcNum=String(p.num).padStart(2,'0');
  }
  // Existing assignment for this operator at this (week,dow,shift)?
  const existing=S.shifts.find(s=>s.week_start===wk&&s.dow===dow&&s.shift_type===shift&&s.operator_id===id);
  const oldPcId=existing?existing.pc_id:null;
  try{
    let saved;
    if(existing){
      // Dup checks per view
      if(inPCView && existing.pc_id===pcId){ toast(S.lang==='ko'?'이미 이 PC에 배정됨':'Already on this PC','err'); return; }
      if(inClientView && existing.client_id===clientId){ toast(S.lang==='ko'?'이미 이 클라이언트에 배정됨':'Already on this client','err'); return; }
      if(!inPCView && !inClientView && !existing.pc_id && !existing.client_id){ toast(S.lang==='ko'?'이미 이 슬롯에 배정됨':'Already in this slot','err'); return; }
      // Build update — fill in whichever dimension we're editing
      const upd={};
      if(inPCView){ upd.pc_id=effPcId; upd.pc_num=effPcNum; }
      else if(inClientView){
        upd.client_id=clientId; upd.client_name=clientName;
        // also cascade pc from client binding (or clear if newly-empty)
        upd.pc_id=effPcId; upd.pc_num=effPcNum;
      } else { upd.pc_id=null; upd.pc_num=null; upd.client_id=null; upd.client_name=null; }
      const {data,error}=await sb.from('shifts').update(upd).eq('id',existing.id).select().single();
      if(error){toast(error.message,'err');console.error(error);return;}
      saved=data;
      S.shifts=S.shifts.map(s=>s.id===saved.id?saved:s);
    } else {
      const rec={week_start:wk,dow,shift_type:shift,operator_id:id,operator_name:name,game:null,pc_id:effPcId,pc_num:effPcNum,client_id:inClientView?clientId:null,client_name:clientName};
      const {data,error}=await sb.from('shifts').insert(rec).select().single();
      if(error){toast(error.message,'err');console.error(error);return;}
      saved=data;
      S.shifts.unshift(saved);
    }
    // Sync to PC Status whenever the saved row has a pc_id
    let syncedMsg='';
    if(saved.pc_id){
      try{
        const member=S.team.find(x=>x.id===saved.operator_id);
        const upd={assigned_to:saved.operator_id,assigned_name:member?member.name:saved.operator_name};
        await sb.from('korea_pcs').update(upd).eq('id',saved.pc_id);
        const pcLive=S.pcs.find(p=>p.id===saved.pc_id);
        if(pcLive){pcLive.assigned_to=upd.assigned_to;pcLive.assigned_name=upd.assigned_name;}
        syncedMsg=' · PC-'+(pcLive?String(pcLive.num).padStart(2,'0'):saved.pc_num)+' '+(S.lang==='ko'?'반영':'synced');
      }catch(e){console.warn('PC sync failed:',e);}
    }
    // Unassign old PC if we just moved the operator to a different PC
    if(oldPcId && oldPcId!==saved.pc_id){
      const oldPc=S.pcs.find(p=>p.id===oldPcId);
      if(oldPc && oldPc.assigned_to===saved.operator_id){
        try{
          await sb.from('korea_pcs').update({assigned_to:null,assigned_name:null}).eq('id',oldPcId);
          oldPc.assigned_to=null; oldPc.assigned_name=null;
        }catch(e){console.warn('Old PC unsync failed:',e);}
      }
    }
    toast((S.lang==='ko'?'✓ 배정됨':'✓ Assigned')+syncedMsg);
    render();
  }catch(e){toast('Error: '+e.message,'err');console.error(e);}
}
async function schedRemove(ev,id){
  ev.stopPropagation();
  if(!can('schedule_edit'))return;
  const s=S.shifts.find(x=>x.id===id);
  try{
    const {error}=await sb.from('shifts').delete().eq('id',id);
    if(error){toast(error.message,'err');return;}
    S.shifts=S.shifts.filter(x=>x.id!==id);
    // If this was a PC-tagged assignment AND the PC currently shows this operator, also unassign on PC Status
    if(s && s.pc_id){
      const pcLive=S.pcs.find(p=>p.id===s.pc_id);
      if(pcLive && pcLive.assigned_to===s.operator_id){
        try{
          await sb.from('korea_pcs').update({assigned_to:null,assigned_name:null}).eq('id',s.pc_id);
          pcLive.assigned_to=null; pcLive.assigned_name=null;
          toast(S.lang==='ko'?'제거 · PC 현황도 해제됨':'Removed · PC Status also cleared');
        }catch(e){console.warn('PC unsync failed:',e);}
      }
    }
    render();
  }catch(e){toast('Error: '+e.message,'err');}
}
async function schedCycleGame(ev,id){
  ev.stopPropagation();
  if(!can('schedule_edit'))return;
  const s=S.shifts.find(x=>x.id===id); if(!s)return;
  const next=s.game==='Lineage'?'Maple':(s.game==='Maple'?null:'Lineage');

    const {data,error}=await sb.from('shifts').update({game:next}).eq('id',id).select().single();
    if(error){toast(error.message,'err');return;}
    S.shifts=S.shifts.map(x=>x.id===id?data:x);render();
  }catch(e){toast('Error: '+e.message,'err');}
}

  const zg={};

  const rowHtml=m=>{const nm=ko?m.kr:m.en;const tr=ko?m.trKr:m.trEn;const search=(m.en+' '+m.kr+' '+m.trEn+' '+m.trKr).toLowerCase();

  const sections=zkeys.map(k=>{const g=zg[k];const zoneName=ko?g.kr:g.en;
    const rows=g.mons.slice().sort((a,b)=>a.lv-b.lv).map(rowHtml).join('');
    return '<div class="mon-zone" style="margin-bottom:6px">'
      +'<div class="mon-zone-head" onclick="toggleZone(this)" style="display:flex;align-items:center;gap:9px;padding:11px 12px;cursor:pointer;background:var(--bg-c);border:1px solid var(--br);border-radius:8px">'

  const monstersContent='<div class="psub" style="margin-bottom:14px">'+(ko?'지역별 몬스터 — 지역을 눌러 펼치세요. 출처: lcinfo.io':'Monsters by location — tap a zone to expand. Source: lcinfo.io')+'</div>'

  const inS='width:100%;padding:9px 12px;border:1px solid var(--br2);border-radius:8px;background:var(--bg-i);color:var(--tx);font-family:inherit;font-size:13px';
  const logs=(S.expLogs||[]);
  const target=S.expTarget||30;
  const today=new Date().toISOString().slice(0,10);
  const fmtDate=d=>{try{return new Date(d).toLocaleDateString(ko?'ko-KR':'en-US',{month:'short',day:'numeric'});}catch(e){return d;}};
  const accs={};logs.forEach(e=>{(accs[e.account]=accs[e.account]||[]).push(e);});
  const accNames=Object.keys(accs).sort();
  const accCards=accNames.map(name=>{
    const es=accs[name].slice().sort((a,b)=>(a.log_date<b.log_date?-1:(a.log_date>b.log_date?1:0)));
    const entryRows=es.map(e=>'<div style="display:flex;align-items:center;gap:10px;font-size:12px;padding:5px 0;border-bottom:1px solid var(--br)"><span style="color:var(--tx3);width:60px">'+fmtDate(e.log_date)+'</span><span style="font-weight:600">Lv.'+e.level+'</span><span style="color:var(--ac-strong)">'+(+e.exp_pct).toFixed(4)+'%</span><button onclick="delExpLog(\''+e.id+'\')" style="margin-left:auto;background:none;border:none;color:var(--tx3);cursor:pointer;font-size:12px">🗑</button></div>').join('');
    let proj='';
    if(es.length>=2){
      const f=es[0],l=es[es.length-1];
      const days=(new Date(l.log_date)-new Date(f.log_date))/86400000;
      const gained=cumExp(l.level,+l.exp_pct)-cumExp(f.level,+f.exp_pct);
      if(days>0&&gained>0){
        const perDay=gained/days,pctPerDay=perDay/reqExp(l.level)*100,needed=cumExp(target,0)-cumExp(l.level,+l.exp_pct);
        if(needed<=0){proj='<div style="font-size:12px;color:#5fae7a;margin-top:8px">✓ '+(ko?'이미 Lv.'+target+' 이상':'Already at/over Lv.'+target)+'</div>';}
        else{const daysLeft=needed/perDay,finish=new Date(new Date(l.log_date).getTime()+daysLeft*86400000);
          proj='<div style="margin-top:10px;padding:10px 12px;background:rgba(95,174,122,.1);border-radius:8px;font-size:12px;line-height:1.7">'
            +'<div style="color:var(--tx2)">'+(ko?'실측 속도':'Real pace')+': <b style="color:var(--ac-strong)">'+pctPerDay.toFixed(2)+'%/'+(ko?'일':'day')+'</b></div>'
            +'<div style="color:#5fae7a;font-weight:600;margin-top:3px">🎯 Lv.'+target+' ≈ '+Math.ceil(daysLeft)+(ko?'일 후 · ':' days · ')+fmtDate(finish.toISOString())+'</div>'
          +'</div>';}
      }else if(days<=0){proj='<div style="font-size:11px;color:var(--tx3);margin-top:8px">'+(ko?'다른 날짜에도 기록하면 속도가 계산됩니다.':'Log on a different day to compute pace.')+'</div>';}
      else{proj='<div style="font-size:11px;color:var(--tx3);margin-top:8px">'+(ko?'진행이 감지되지 않았습니다.':'No forward progress detected yet.')+'</div>';}
    }else{proj='<div style="font-size:11px;color:var(--tx3);margin-top:8px">'+(ko?'하루 더 기록하면 속도와 도달 예상일이 표시됩니다.':'Log one more day to see pace + finish date.')+'</div>';}
    const last=es[es.length-1];
    return '<div class="panel" style="margin-bottom:12px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><div style="font-weight:600;font-size:14px">'+esc(name)+'</div><div style="font-size:12px;color:var(--tx2)">Lv.'+last.level+' · '+(+last.exp_pct).toFixed(2)+'%</div></div>'+entryRows+proj+'</div>';
  }).join('');
  const trackerContent='<div class="psub" style="margin-bottom:16px">'+(ko?'계정별 EXP %를 매일 기록하면 실제 성장 속도와 목표 레벨 도달 예상일을 보여줍니다.':'Log each account\'s EXP % daily — it shows the real pace and projected date to hit your target level.')+'</div>'
    +'<div class="panel" style="margin-bottom:18px;max-width:640px">'
    +'<div style="font-weight:600;font-size:13px;margin-bottom:12px">'+(ko?'＋ 기록 추가':'＋ Add a log')+'</div>'
    +'<div class="fgrid" style="margin-bottom:12px">'
    +'<div class="fg2"><label>'+(ko?'계정/캐릭터':'Account / char')+'</label><input id="el-acc" placeholder="'+(ko?'예: PC-02 기사':'e.g. PC-02 Knight')+'" style="'+inS+'"></div>'
    +'<div class="fg2"><label>'+(ko?'레벨':'Level')+'</label><input id="el-lvl" type="number" placeholder="30" style="'+inS+'"></div>'
    +'<div class="fg2"><label>EXP %</label><input id="el-pct" type="number" step="0.0001" placeholder="88.5735" style="'+inS+'"></div>'
    +'<div class="fg2"><label>'+(ko?'날짜':'Date')+'</label><input id="el-date" type="date" value="'+today+'" style="'+inS+'"></div>'
    +'</div>'
    +'<button class="btn-add" onclick="addExpLog()">'+(ko?'기록 저장':'Save log')+'</button>'
    +'</div>'
    +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><span style="font-size:13px;color:var(--tx2)">'+(ko?'목표 레벨':'Target level')+'</span><input type="number" value="'+target+'" onchange="setExpTarget(this.value)" style="width:90px;'+inS+'"></div>'
    +(accNames.length?accCards:'<div style="font-size:13px;color:var(--tx3);padding:8px">'+(ko?'아직 기록이 없습니다. 위에서 첫 기록을 추가하세요.':'No logs yet — add your first entry above.')+'</div>')
    +'<div style="font-size:11px;color:var(--tx3);margin-top:14px;line-height:1.6">'+(ko?'※ 속도는 첫 기록과 최신 기록 사이 실측 진행으로 계산되어 레벨 페널티가 자동 반영됩니다. 매일 같은 시간에 기록하면 가장 정확합니다.':'※ Pace is measured from your actual progress between the first and latest log, so the level penalty is automatically included. Logging at the same time each day is most accurate.')+'</div>';

  const body=tab==='monsters'?monstersContent:(tab==='calc'?trackerContent:manualContent);

  return '<div style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.14em;font-weight:500;margin-bottom:8px">'+(ko?'운영':'Operations')+'</div>'
    +'<div class="ph" style="margin-bottom:6px">'+(ko?'리니지 운영 매뉴얼':'Lineage Ops Manual')+'</div>'
    +'<div class="psub" style="margin-bottom:20px">'+(ko?'PC별 캐릭터 설정과 운영 규칙. 근무 중 열어두세요.':'Per-PC character setup and operating rules. Keep this open during your shift.')+'</div>'
    +tabBar+body;
}

async function saveMapleRules(){
  try{
    const {error}=await sb.from('app_settings').upsert({key:'maple_rules',value:S.mapleRules,updated_at:new Date().toISOString(),updated_by:S.user?.id},{onConflict:'key'});
    if(error){toast(error.message,'err');console.error(error);return false;}
    return true;
  }catch(e){toast('Error: '+e.message,'err');return false;}
}
function addMapleRule(){if(!S.mapleRules)S.mapleRules=[];S.mapleRules.push({titleEn:'New section',titleKo:'새 섹션',bodyEn:'',bodyKo:''});S.editMapleRuleIdx=S.mapleRules.length-1;render();}
async function delMapleRule(i){if(!confirm(S.lang==='ko'?'이 섹션을 삭제할까요?':'Delete this section?'))return;S.mapleRules.splice(i,1);await saveMapleRules();render();}
async function saveMapleRule(i){
  const ten=document.getElementById('mr-ten'),tko=document.getElementById('mr-tko'),ben=document.getElementById('mr-ben'),bko=document.getElementById('mr-bko');
  S.mapleRules[i]={titleEn:ten.value,titleKo:tko.value,bodyEn:ben.value,bodyKo:bko.value};
  if(await saveMapleRules()){S.editMapleRuleIdx=null;toast('Saved ✓');render();}
}
async function saveMaplePC(id){
  const g=k=>{const el=document.getElementById('mp-'+k);return el?el.value.trim()||null:null;};
  const upd={maple_type:g('type'),maple_level:g('level'),maple_class:g('class'),maple_route:g('route'),maple_note:g('note'),maple_schedule:readSchedRows()};
  try{
    const {error}=await sb.from('korea_pcs').update(upd).eq('id',id);
    if(error){if(/column|schema|could not find/i.test(error.message)){alert('Database needs the game columns. Run the SQL provided.\n\n'+error.message);}else toast(error.message,'err');console.error(error);return;}
    S.pcs=S.pcs.map(p=>p.id===id?{...p,...upd}:p);
    S.editMaplePC=null;toast('PC saved ✓');render();
  }catch(e){toast('Error: '+e.message,'err');}
}

        +'</div>'

function pgChecklist(){
  const ko=S.lang==='ko';
  const items=S.myChecklist?.items||{};
  const total=CHECKLIST.length;
  const done=Object.values(items).filter(v=>v===true).length;
  const pct=total>0?Math.round((done/total)*100):0;
  const secs=[['before',ko?'시프트 전':'Before shift'],['during',ko?'시프트 중':'During shift'],['end',ko?'시프트 종료':'End of shift']];
  const blocks=secs.map(([sec,label])=>{
    const list=CHECKLIST.filter(c=>c.sec===sec);
    if(!list.length) return '';
    const cnt=list.filter(c=>items[c.id]).length;
    const rows=list.map(c=>{const on=!!items[c.id];return `<div class="cl-row ${on?'done':''}" onclick="toggleCheck('${c.id}')"><div class="cl-check ${on?'on':''}"></div><div class="cl-label">${esc(c.label)}</div></div>`;}).join('');
    return `<div class="cl-block"><div class="cl-h"><span>${label}</span><span style="color:${cnt===list.length?'var(--ok)':'var(--tx3)'}">${cnt}/${list.length}</span></div><div class="cl-list">${rows}</div></div>`;
  }).join('');
  return `<div style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.14em;font-weight:500;margin-bottom:8px">${ko?'운영 · 오늘':'Operations · Today'}</div>`
    +`<div class="ph" style="margin-bottom:6px">${ko?'일일 체크리스트':'Daily Checklist'}</div>`
    +`<div class="psub" style="margin-bottom:24px">${ko?'시프트 전, 중, 후 항목을 확인하세요.':'Run through these items before, during and after your shift.'}</div>`
    +`<div class="panel" style="margin-bottom:24px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div><div style="font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.14em;text-transform:uppercase">${ko?'시프트 진행':'Shift progress'}</div><div style="display:flex;align-items:baseline;gap:8px;margin-top:4px"><div style="font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1">${done}<span style="font-size:18px;color:var(--tx3)"> / ${total}</span></div><div style="font-size:12px;color:var(--tx2)">${ko?'완료':'items complete'}</div></div></div><div style="text-align:right"><div style="font-size:28px;color:var(--ac);font-weight:700">${pct}%</div><div style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em">${ko?'완료됨':'completed'}</div></div></div><div style="height:6px;background:var(--bg);border-radius:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--ac);border-radius:3px;transition:width .25s"></div></div></div>`
    +blocks;
}

async function toggleCheck(itemId){
  try{
    const today=new Date().toISOString().slice(0,10);
    if(!S.myChecklist){
      const items={[itemId]:true};
      const {data,error}=await sb.from('daily_checklists').insert({user_id:S.user.id,user_name:S.profile.name,shift_date:today,items}).select().single();
      if(error){toast(error.message,'err');console.error(error);return;}
      S.myChecklist=data;
      // Also push into teamChecklists if manager
      if(can('checklist_team')) S.teamChecklists.push(data);
    } else {
      const items={...(S.myChecklist.items||{})};
      items[itemId]=!items[itemId];
      const {error}=await sb.from('daily_checklists').update({items,updated_at:new Date().toISOString()}).eq('id',S.myChecklist.id);
      if(error){toast(error.message,'err');console.error(error);return;}
      S.myChecklist.items=items;
      // Sync with teamChecklists
      const idx=S.teamChecklists.findIndex(c=>c.id===S.myChecklist.id);
      if(idx>=0) S.teamChecklists[idx]={...S.myChecklist};
    }
    render();
  }catch(e){toast('Error: '+e.message,'err');console.error('[toggleCheck]',e);}
}

async function addPC(){
  try{
    const maxNum=S.pcs.reduce((m,p)=>Math.max(m,p.num||0),0);
    const obj={num:maxNum+1,status:'Offline'};
    // Try letting the DB generate the id first
    let {data,error}=await sb.from('korea_pcs').insert(obj).select().single();
    // If the id column has no auto-generate, compute the next id ourselves
    if(error && error.message.toLowerCase().includes('id')){
      const maxId=S.pcs.reduce((m,p)=>Math.max(m,(typeof p.id==='number'?p.id:0)),0);
      ({data,error}=await sb.from('korea_pcs').insert({...obj,id:maxId+1}).select().single());
    }
    if(error){toast(error.message,'err');console.error(error);return;}
    if(data){S.pcs.push(data);S.pcs.sort((a,b)=>(a.num||0)-(b.num||0));toast('PC '+data.num+' added ✓');}
    render();
  }catch(e){toast('Error: '+e.message,'err');console.error('[addPC]',e);}
}
async function removeLastPC(){
  if(!S.pcs.length){toast('No PCs to remove','err');return;}
  const last=[...S.pcs].sort((a,b)=>(b.num||0)-(a.num||0))[0];
  removePC(last.id,last.num);
}
async function removePC(pcId,pcNum){
  try{
    if(!confirm((S.lang==='ko'?'PC ':'Remove PC ')+pcNum+(S.lang==='ko'?' 삭제?':'?')))return;
    const {error}=await sb.from('korea_pcs').delete().eq('id',pcId);
    if(error){toast(error.message,'err');console.error(error);return;}
    S.pcs=S.pcs.filter(p=>p.id!==pcId);
    toast('PC '+pcNum+' removed');
    render();
  }catch(e){toast('Error: '+e.message,'err');console.error('[removePC]',e);}
}
async function assignPC(pcId,userId){
  try{
    const member=S.team.find(m=>m.id===userId);
    const upd={assigned_to:userId||null,assigned_name:member?member.name:null};
    const {error}=await sb.from('korea_pcs').update(upd).eq('id',pcId);
    if(error){
      console.error('[assignPC]',error);
      if(/assigned_to|assigned_name|column/i.test(error.message)) alert('Assignment needs a database update.\n\nYour korea_pcs table is missing the assigned_to / assigned_name columns. Ask your developer to run the SQL provided (ALTER TABLE korea_pcs ADD COLUMN...).\n\nError: '+error.message);
      else toast('Assign failed: '+error.message,'err');
      return;
    }
    const pc=S.pcs.find(p=>p.id===pcId);
    if(pc){pc.assigned_to=upd.assigned_to;pc.assigned_name=upd.assigned_name;}
    logActivity('PC assignment','PC-'+(pc?pc.num:'?')+(upd.assigned_name?' → '+upd.assigned_name:' unassigned'));
    toast(userId?'Assigned ✓':'Unassigned');
    render();
  }catch(e){toast('Error: '+e.message,'err');console.error('[assignPC]',e);}
}

// ── HR ATTENDANCE ──────────────────────────────────────────────────────────
function pgHrAttend(){
  const ko=S.lang==='ko';
  const att=S.myTodayAtt;
  const isIn=att&&att.clock_in&&!att.clock_out;
  const isOut=att&&att.clock_out;
  const onBreak=att&&att.break_start&&!att.break_end;
  const fmtTime=ts=>{if(!ts)return'—';const d=new Date(ts);return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});};
  const calcHours=(inTs,outTs,brkSt,brkEn)=>{if(!inTs||!outTs)return null;let ms=new Date(outTs)-new Date(inTs);if(brkSt&&brkEn)ms-=(new Date(brkEn)-new Date(brkSt));const h=Math.floor(ms/3600000);const m=Math.floor((ms%3600000)/60000);return h+'h '+m+'m';};
  const todayHrs=att?calcHours(att.clock_in,att.clock_out,att.break_start,att.break_end):null;

  // Clock buttons
  const clockBtns=`<div class="att-clock">
    <button class="att-btn att-in" onclick="attClockIn()" ${att&&att.clock_in?'disabled':''}>⏱ ${ko?'출근':'Clock In'}</button>
    <button class="att-btn att-break" onclick="attBreak()" ${!isIn||isOut?'disabled':''}>${onBreak?(ko?'🔙 복귀':'🔙 Back'):(ko?'☕ 휴게 시작':'☕ Break')}</button>
    <button class="att-btn att-out" onclick="attClockOut()" ${!isIn||isOut?'disabled':''}>⏹ ${ko?'퇴근':'Clock Out'}</button>
  </div>`;

  // Today's status card
  const todayCard=`<div class="att-today">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:13px;font-weight:600">${ko?'오늘':'Today'} · ${new Date().toLocaleDateString(ko?'ko-KR':'en-US',{weekday:'short',month:'short',day:'numeric'})}</div>
      <div style="display:flex;align-items:center;gap:8px">
        ${todayHrs?`<span class="bdg bs">${ko?'총':'Total'} ${todayHrs}</span>`:isIn?`<span class="bdg bi">${ko?'근무 중':'On shift'}</span>`:att?`<span class="bdg bx">${ko?'완료':'Done'}</span>`:`<span class="bdg bx">${ko?'미출근':'Not clocked in'}</span>`}
        ${att&&can('attend_reset')?`<button class="btn-sm" onclick="attResetToday()" title="${ko?'오늘 기록 초기화':'Clear today and start over'}">↺ ${ko?'초기화':'Reset'}</button>`:''}
      </div>
    </div>
    <div style="display:flex;gap:20px;flex-wrap:wrap">
      <div><div style="font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">${ko?'출근':'Clock In'}</div><div style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:${att?.clock_in?'var(--ok)':'var(--tx3)'}">${fmtTime(att?.clock_in)}</div></div>
      <div><div style="font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">${ko?'휴게 시작':'Break Start'}</div><div style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:${att?.break_start?'var(--ye)':'var(--tx3)'}">${fmtTime(att?.break_start)}</div></div>
      <div><div style="font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">${ko?'휴게 종료':'Break End'}</div><div style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:${att?.break_end?'var(--ye)':'var(--tx3)'}">${fmtTime(att?.break_end)}</div></div>
      <div><div style="font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">${ko?'퇴근':'Clock Out'}</div><div style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:${att?.clock_out?'var(--re)':'var(--tx3)'}">${fmtTime(att?.clock_out)}</div></div>
    </div>
    ${isOut?`<div style="margin-top:12px;font-size:11px;color:var(--tx3)">${can('attend_reset')?(ko?'오늘 근무 완료. 다시 출근하려면 초기화를 누르세요.':"Shift complete for today. Press Reset to clock in again."):(ko?'오늘 근무 완료.':'Shift complete for today.')}</div>`:''}
  </div>`;

  // Record table
  const attView=S.attView||'weekly';
  const now=new Date();
  const todayIso=isoDate(now);
  let filtered=S.attendance;
  if(attView==='weekly'){const wk=new Date(now);wk.setDate(wk.getDate()-(wk.getDay()+6)%7);const wkIso=isoDate(wk);filtered=S.attendance.filter(a=>a.date>=wkIso&&a.date<=todayIso);}
  else if(attView==='monthly'){const mon=todayIso.slice(0,7);filtered=S.attendance.filter(a=>a.date&&a.date.startsWith(mon));}
  const showAll=can('hr_attend_all');
  const canReset=can('attend_reset');
  const rows=filtered.length?filtered.map(a=>{
    const hrs=calcHours(a.clock_in,a.clock_out,a.break_start,a.break_end);
    const mem=S.team.find(m=>m.id===a.user_id);
    const avUrl=(a.user_id===S.profile.id?S.profile.avatar_url:mem?.avatar_url)||null;
    const avInit=mem?.initials||null;
    return `<tr>
      ${showAll?`<td><div style="display:flex;align-items:center;gap:8px">${av(a.user_name,avInit,24,avUrl)}<span style="font-weight:500">${esc(a.user_name||'?')}</span></div></td>`:''}
      <td style="font-variant-numeric:tabular-nums">${a.date||'—'}</td>
      <td style="color:var(--ok);font-weight:600">${fmtTime(a.clock_in)}</td>
      <td style="color:var(--ye)">${a.break_start?fmtTime(a.break_start):'—'}</td>
      <td style="color:var(--ye)">${a.break_end?fmtTime(a.break_end):'—'}</td>
      <td style="color:var(--re);font-weight:600">${fmtTime(a.clock_out)}</td>
      <td>${hrs?`<span class="bdg bs">${hrs}</span>`:'<span class="bdg bi">On shift</span>'}</td>
      ${canReset?`<td><button class="btn-del btn-sm" onclick="attResetRow(${a.id})" title="${ko?'이 기록 초기화':'Reset this record'}">↺</button></td>`:''}
    </tr>`;
  }).join(''):`<tr><td colspan="${(showAll?1:0)+(canReset?1:0)+6}" class="empty" style="border:none">${ko?'기록 없음':'No records'}</td></tr>`;

  const tabRow=`<div class="att-tab-row">
    ${['weekly','monthly','yearly'].map(v=>`<button class="att-tab ${attView===v?'on':''}" onclick="S.attView='${v}';render()">${ko?{weekly:'이번 주',monthly:'이번 달',yearly:'올해'}[v]:{weekly:'This Week',monthly:'This Month',yearly:'All Time'}[v]}</button>`).join('')}
  </div>`;

  return `<div style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.14em;font-weight:500;margin-bottom:8px">${ko?'인사':'HR'}</div>`
    +`<div class="ph" style="margin-bottom:6px">${ko?'출퇴근':'Attendance'}</div>`
    +`<div class="psub" style="margin-bottom:20px">${ko?'출퇴근 기록 및 근무 시간 확인':'Track clock-in, clock-out, and break times'}</div>`
    +clockBtns
    +todayCard
    +tabRow
    +`<div class="tw"><table><thead><tr>${showAll?`<th>${ko?'이름':'Name'}</th>`:''}<th>${ko?'날짜':'Date'}</th><th>${ko?'출근':'In'}</th><th>${ko?'휴게 시작':'Break'}</th><th>${ko?'휴게 종료':'Resume'}</th><th>${ko?'퇴근':'Out'}</th><th>${ko?'총 시간':'Hours'}</th>${canReset?`<th></th>`:''}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function attClockIn(){
  const today=isoDate(new Date());
  if(S.myTodayAtt&&S.myTodayAtt.clock_in){toast(S.lang==='ko'?'이미 출근했습니다':'Already clocked in','err');return;}
  const rec={user_id:S.user.id,user_name:S.profile.name,date:today,clock_in:new Date().toISOString()};
  try{
    const {data,error}=await sb.from('attendance').insert(rec).select().single();
    if(error){toast(error.message,'err');console.error(error);return;}
    S.myTodayAtt=data;
    if(!S.attendance.find(a=>a.id===data.id))S.attendance.unshift(data);
    toast(S.lang==='ko'?'출근 완료 ✓':'Clocked in ✓');render();
  }catch(e){toast('Error: '+e.message,'err');}
}
async function attResetToday(){
  if(!can('attend_reset')){toast(S.lang==='ko'?'권한이 없습니다 (CEO/매니저만 가능)':'Only CEO / Manager can reset','err');return;}
  if(!S.myTodayAtt)return;
  if(!confirm(S.lang==='ko'?'오늘 출퇴근 기록을 초기화하시겠습니까? 다시 출근할 수 있습니다.':"Reset today's attendance? This clears your clock-in/out for today so you can start over.")) return;
  const id=S.myTodayAtt.id;
  try{
    const {error}=await sb.from('attendance').delete().eq('id',id);
    if(error){toast(error.message,'err');console.error(error);return;}
    S.attendance=S.attendance.filter(a=>a.id!==id);
    S.myTodayAtt=null;
    toast(S.lang==='ko'?'초기화 완료 — 다시 출근하세요':'Reset done — you can clock in again');
    render();
  }catch(e){toast('Error: '+e.message,'err');}
}
async function attResetRow(id){
  if(!can('attend_reset')){toast(S.lang==='ko'?'권한이 없습니다 (CEO/매니저만 가능)':'Only CEO / Manager can reset','err');return;}
  const rec=S.attendance.find(a=>a.id===id);
  if(!confirm(S.lang==='ko'?`${rec?.user_name||''}님의 ${rec?.date||''} 기록을 초기화하시겠습니까?`:`Reset ${rec?.user_name||'this'} record for ${rec?.date||'this day'}?`)) return;
  try{
    const {error}=await sb.from('attendance').delete().eq('id',id);
    if(error){toast(error.message,'err');console.error(error);return;}
    S.attendance=S.attendance.filter(a=>a.id!==id);
    if(S.myTodayAtt&&S.myTodayAtt.id===id)S.myTodayAtt=null;
    toast(S.lang==='ko'?'기록 초기화 완료':'Record reset');
    logActivity('Attendance reset',rec?(rec.user_name+' · '+rec.date):id);
    render();
  }catch(e){toast('Error: '+e.message,'err');}
}
async function attBreak(){
  if(!S.myTodayAtt)return;
  const a=S.myTodayAtt;
  const isOnBreak=a.break_start&&!a.break_end;
  const field=isOnBreak?{break_end:new Date().toISOString()}:{break_start:new Date().toISOString()};
  try{
    const {data,error}=await sb.from('attendance').update(field).eq('id',a.id).select().single();
    if(error){toast(error.message,'err');return;}
    S.myTodayAtt=data;
    S.attendance=S.attendance.map(x=>x.id===data.id?data:x);
    toast(isOnBreak?(S.lang==='ko'?'복귀 완료 ✓':'Back from break ✓'):(S.lang==='ko'?'휴게 시작 ✓':'Break started ✓'));render();
  }catch(e){toast('Error: '+e.message,'err');}
}
async function attClockOut(){
  if(!S.myTodayAtt)return;
  try{
    const {data,error}=await sb.from('attendance').update({clock_out:new Date().toISOString()}).eq('id',S.myTodayAtt.id).select().single();
    if(error){toast(error.message,'err');return;}
    S.myTodayAtt=data;
    S.attendance=S.attendance.map(x=>x.id===data.id?data:x);
    toast(S.lang==='ko'?'퇴근 완료 ✓':'Clocked out ✓');render();
  }catch(e){toast('Error: '+e.message,'err');}
}

async function saveTrustScore(){
  const n=document.getElementById('nt-name').value.trim();
  if(!n)return;
  const rec={player_name:n,shift:document.getElementById('nt-shift').value,warn_points:parseFloat(document.getElementById('nt-warn').value)||0,trust_points:parseInt(document.getElementById('nt-tp').value)||0,protected_until:document.getElementById('nt-prot').value||null,notes:document.getElementById('nt-note').value,updated_by:S.profile?.name,updated_at:new Date().toISOString()};
  try{
    const {data,error}=await sb.from('trust_scores').insert(rec).select().single();
    if(error){toast(error.message,'err');return;}
    if(data){S.trustScores.unshift(data);toast('Player added ✓');}
    S.showAddTrust=false;render();
  }catch(e){toast('Error: '+e.message,'err');}
}
async function updateTrustScore(id){
  const rec={warn_points:parseFloat(document.getElementById(`et-warn-${id}`).value)||0,trust_points:parseInt(document.getElementById(`et-tp-${id}`).value)||0,protected_until:document.getElementById(`et-prot-${id}`).value||null,updated_by:S.profile?.name,updated_at:new Date().toISOString()};
  try{
    const {data,error}=await sb.from('trust_scores').update(rec).eq('id',id).select().single();
    if(error){toast(error.message,'err');return;}
    if(data){S.trustScores=S.trustScores.map(x=>x.id===id?data:x);toast('Updated ✓');}
    S.editTrust=null;render();
    logActivity('Trust score updated',S.trustScores.find(x=>x.id===id)?.player_name||id);
  }catch(e){toast('Error: '+e.message,'err');}
}
async function delTrustScore(id){
  if(!confirm('Delete this player?'))return;
  try{
    const {error}=await sb.from('trust_scores').delete().eq('id',id);
    if(error){toast(error.message,'err');return;}
    S.trustScores=S.trustScores.filter(x=>x.id!==id);toast('Deleted');render();
  }catch(e){toast('Error: '+e.message,'err');}
}

function pgOnboarding(){
  const ko=S.lang==='ko';
  const canEdit=can('onboarding_edit');
  const staffList=S.team.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const selId=S.onboardStaff;
  const rec=selId?S.onboarding.find(o=>o.staff_id===selId):null;
  const items=rec?.items||{};
  const doneN=selId?ONBOARDING_ITEMS.filter(it=>items[it.id]).length:0;
  const total=ONBOARDING_ITEMS.length;
  const pct=Math.round(doneN/total*100);

  // ── Checklist block (only for HR / Manager / CEO) ──
  let checklistBlock='';
  if(canEdit){
    const selector=`<select onchange="S.onboardStaff=this.value||null;render()" style="padding:8px 12px;border:1px solid var(--br2);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg-i);color:var(--tx);min-width:200px">
      <option value="">${ko?'직원 선택...':'Select Staff...'}</option>
      ${staffList.map(m=>`<option value="${m.id}"${selId===m.id?' selected':''}>${esc(m.name)}</option>`).join('')}
    </select>`;
    const cards=ONBOARDING_ITEMS.map(it=>{
      const done=!!items[it.id];
      const tag=it.tag?`<span class="ob-tag">${it.tag}</span>`:'';
      const click=selId?`onclick="toggleOnboard('${it.id}')"`:'';
      return `<div class="ob-card ${done?'done':''} ${selId?'':'ob-disabled'}" ${click}>
        <div class="ob-check ${done?'on':''}"></div>
        <div class="ob-label">${ko?it.labelKo:it.label}${tag}</div>
      </div>`;
    }).join('');
    checklistBlock=`<div class="ob-divider">${ko?'첫날 체크리스트':'First-Day Checklist'}</div>`
      +`<div class="ob-bar">`
        +`<div style="display:flex;align-items:center;gap:10px">${selector}${selId?`<button class="btn-sm" onclick="resetOnboard()">${ko?'초기화':'Reset'}</button>`:''}</div>`
        +`<div style="display:flex;align-items:center;gap:12px;flex:1;max-width:320px">`
          +(selId?`<div class="ob-progress"><div class="ob-progress-fill" style="width:${pct}%"></div></div><div style="font-size:13px;font-weight:600;white-space:nowrap;color:${doneN===total?'var(--ok)':'var(--tx2)'}">${ko?'완료':'Done'} <span style="color:var(--ac)">${doneN}</span> / ${total}</div>`:`<div style="font-size:12px;color:var(--tx3)">${ko?'직원을 선택하세요':'Select a staff member'}</div>`)
        +`</div>`
      +`</div>`
      +`<div class="ob-grid">${cards}</div>`;
  }

  // ── Guide block (flat, visible to everyone) ──
  const guide=MANUAL_SECTIONS.map(s=>{
    let body='';
    if(s.subs){
      body=s.subs.map(ss=>`<div class="guide-sub">${esc(ko?ss.subKo:ss.sub)}</div><ul>${(ko?ss.itemsKo:ss.items).map(it=>`<li>${esc(it)}</li>`).join('')}</ul>`).join('');
    }else{
      body=`<ul>${(ko?s.itemsKo:s.items).map(it=>`<li>${esc(it)}</li>`).join('')}</ul>`;
      if(s.warn)body+=`<div class="man-warn">⚠ ${esc(ko?s.warnKo:s.warn)}</div>`;
    }
    return `<div class="guide-card"><div class="guide-title">${esc(ko?s.titleKo:s.title)}</div>${body}</div>`;
  }).join('');
  const guideBlock=`<div class="ob-divider">${ko?'직원 안내서':'Staff Guide'}</div>${guide}`;

  const subtitle=canEdit
    ? (ko?'신규 직원 체크리스트 + 전체 안내서':"Track a new hire's checklist, plus the full staff guide")
    : (ko?'신규 직원을 위한 안내서':'Your guide for getting started');

  return `<div style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.14em;font-weight:500;margin-bottom:8px">${ko?'인사':'HR'}</div>`
    +`<div class="ph" style="margin-bottom:6px">${ko?'온보딩':'Onboarding'}</div>`
    +`<div class="psub" style="margin-bottom:20px">${subtitle}</div>`
    +checklistBlock
    +guideBlock;
}
async function toggleOnboard(itemId){
  const selId=S.onboardStaff;if(!selId)return;
  const staff=S.team.find(m=>m.id===selId);
  let rec=S.onboarding.find(o=>o.staff_id===selId);
  const items={...(rec?.items||{})};
  items[itemId]=!items[itemId];
  try{
    const {data,error}=await sb.from('onboarding').upsert({staff_id:selId,staff_name:staff?.name,items,updated_at:new Date().toISOString()},{onConflict:'staff_id'}).select().single();
    if(error){toast(error.message,'err');console.error(error);return;}
    if(rec){S.onboarding=S.onboarding.map(o=>o.staff_id===selId?data:o);}else{S.onboarding.push(data);}
    render();
  }catch(e){toast('Error: '+e.message,'err');}
}
async function resetOnboard(){
  const selId=S.onboardStaff;if(!selId)return;
  if(!confirm('Reset all checklist items for this staff?'))return;
  const staff=S.team.find(m=>m.id===selId);
  try{
    const {data,error}=await sb.from('onboarding').upsert({staff_id:selId,staff_name:staff?.name,items:{},updated_at:new Date().toISOString()},{onConflict:'staff_id'}).select().single();
    if(error){toast(error.message,'err');return;}
    S.onboarding=S.onboarding.map(o=>o.staff_id===selId?data:o);
    if(!S.onboarding.find(o=>o.staff_id===selId))S.onboarding.push(data);
    toast('Reset done');render();
  }catch(e){toast('Error: '+e.message,'err');}
}

function toast(msg,type='ok',dur){
  const t=document.getElementById('toast');
  const el=document.createElement('div');
  el.className='toast-msg toast-'+type;
  el.innerHTML='<span>'+msg+'</span><span style="margin-left:12px;cursor:pointer;opacity:.7;font-size:16px">×</span>';
  el.style.cursor='pointer';
  el.onclick=()=>el.remove();
  t.appendChild(el);
  // Errors persist until clicked; success auto-dismiss in 4s
  const ms = dur || (type==='err' ? 0 : 4000);
  if(ms>0) setTimeout(()=>el.remove(),ms);
  console.log('[TOAST '+type.toUpperCase()+']',msg);
}
