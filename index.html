<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--bg-sb:#f7f6f3;--bg-h:#efefee;--bg-a:#e9e9e7;--bg-c:#fff;--bg-i:#fff;--tx:#37352f;--tx2:#787774;--tx3:#acaba8;--br:#e9e9e7;--br2:#d3d1cb;--ac:#a87a1e;--ac-bg:#fbf3df;--ac-strong:#8a6416;--ac-bord:rgba(168,122,30,.35);--gr:#0f7b6c;--gr-bg:#edf3ec;--ok:#0f7b6c;--ok-bg:#edf3ec;--warn:#b5701a;--info:#a87a1e;--info-bg:#fbf3df;--tx4:#acaba8;--re:#e03e3e;--re-bg:#fbe4e4;--ye:#cb912f;--ye-bg:#fdf3d0;--pu:#6940a5;--pu-bg:#f4f0fb;--r:4px;--r2:8px}
[data-theme=dark]{--bg:#0e0e0e;--bg-sb:#131313;--bg-h:#1c1c1c;--bg-a:#232323;--bg-c:#161616;--bg-i:#1a1a1a;--tx:#e6e5e2;--tx2:#989792;--tx3:#5f5e5a;--br:#232322;--br2:#2f2f2d;--ac:#c2a04a;--ac-bg:rgba(194,160,74,.13);--ac-strong:#d4b566;--ac-bord:rgba(194,160,74,.40);--gr:#4d9a8a;--gr-bg:rgba(77,154,138,.12);--ok:#4d9a8a;--ok-bg:rgba(77,154,138,.12);--warn:#d9943a;--info:#c2a04a;--info-bg:rgba(194,160,74,.13);--tx4:#5f5e5a;--re:#c46a6a;--re-bg:rgba(196,106,106,.12);--ye:#c79c4b;--ye-bg:rgba(199,156,75,.12);--pu:#9a7dc4;--pu-bg:rgba(154,125,196,.12)}
body{font-family:'Inter',-apple-system,sans-serif;font-size:14px;background:var(--bg);color:var(--tx)}
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.auth-split{display:flex;width:880px;max-width:100%;min-height:540px;background:var(--bg-c);border:1px solid var(--br);border-radius:18px;overflow:hidden;box-shadow:0 12px 50px rgba(0,0,0,.55)}
.auth-brand{flex:1;background:linear-gradient(160deg,#161616 0%,#131313 50%,#0e0e0e 100%);position:relative;display:flex;align-items:center;padding:52px;overflow:hidden}
.auth-brand::before{content:'';position:absolute;top:-30%;left:-25%;width:440px;height:440px;background:radial-gradient(circle,rgba(194,160,74,.10),transparent 70%);filter:blur(30px);pointer-events:none}
.auth-brand::after{content:'';position:absolute;bottom:-35%;right:-25%;width:380px;height:380px;background:radial-gradient(circle,rgba(120,140,170,.08),transparent 72%);filter:blur(32px);pointer-events:none}
.auth-brand-inner{position:relative;z-index:1}
.auth-mono{width:66px;height:66px;border-radius:18px;background:none;border:3px solid #c2a04a;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:800;color:#c2a04a;margin-bottom:26px;letter-spacing:-1px}
.auth-brand-name{font-size:30px;font-weight:800;letter-spacing:3px;color:#fff;margin-bottom:10px}
.auth-brand-tag{font-size:13px;color:#8a93a3;margin-bottom:36px;font-weight:500;letter-spacing:1px;text-transform:uppercase}
.auth-features{display:flex;flex-direction:column;gap:14px}
.auth-feat{font-size:13px;color:rgba(255,255,255,.72);display:flex;align-items:center;gap:10px}
.auth-feat span{color:#5cb3a1;font-weight:700}
.auth-form-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 44px}
.auth-form-inner{width:100%;max-width:320px}.auth-form-inner .fg{margin-bottom:18px}.auth-form-inner .btn-full{margin-top:6px}
.auth-sub{font-size:14px;color:var(--tx2);margin-bottom:22px;font-weight:500}
.auth-tabs{display:flex;margin-bottom:26px;border:1px solid var(--br);border-radius:var(--r);overflow:hidden}
.auth-tab{flex:1;padding:9px;font-size:13px;font-weight:500;border:none;background:transparent;cursor:pointer;color:var(--tx2);font-family:inherit}
@media(max-width:760px){
  .auth-split{flex-direction:column;width:400px;min-height:auto}
  .auth-brand{padding:34px;text-align:center}
  .auth-brand-inner{display:flex;flex-direction:column;align-items:center}
  .auth-mono{margin-bottom:18px}
  .auth-brand-tag{margin-bottom:0}
  .auth-features{display:none}
  .auth-form-panel{padding:36px 28px}
}
.auth-tab.on{background:var(--tx);color:var(--bg)}
.auth-err{background:var(--re-bg);color:var(--re);border-radius:var(--r);padding:8px 12px;font-size:13px;margin-bottom:12px}
.auth-ok{background:var(--gr-bg);color:var(--gr);border-radius:var(--r);padding:8px 12px;font-size:13px;margin-bottom:12px}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.role-opt{padding:10px;border:1.5px solid var(--br);border-radius:var(--r);cursor:pointer;text-align:center;font-size:13px;background:var(--bg);color:var(--tx2)}
.role-opt.on{border-color:var(--tx);background:var(--tx);color:var(--bg);font-weight:500}
.ro-icon{font-size:20px;display:block;margin-bottom:4px}
.invite-field{display:none}.invite-field.show{display:block}
#app-screen{display:none}
#app{display:flex;min-height:100vh}
#sb{width:240px;background:var(--bg-sb);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;border-right:1px solid var(--br);flex-shrink:0}
.sb-top{padding:14px 14px 8px;display:flex;align-items:center;gap:10px}
.sb-ws-name{font-size:14px;font-weight:700;color:var(--tx);letter-spacing:.2px}
.sb-user-card{padding:8px 12px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--br);margin-bottom:4px}.sb-user-name{font-size:13px;font-weight:600;color:var(--tx);line-height:1.3}.sb-user-line{padding:2px 14px 6px;font-size:13px;color:var(--tx3)}
.sb-badge-wrap{padding:0 14px 8px}
.sb-badge-wrap span{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.sb-ceo{background:var(--ye-bg)!important;color:var(--ye)!important}
.sb-manager{background:var(--gr-bg)!important;color:var(--gr)!important}
.sb-settlement{background:var(--ac-bg)!important;color:var(--ac)!important}
.sb-hr{background:var(--pu-bg)!important;color:var(--pu)!important}
.sb-staff{background:var(--bg-a)!important;color:var(--tx2)!important}
.sb-player{background:var(--re-bg)!important;color:var(--re)!important}
.sb-div{display:none}
.sb-sec{font-size:10px;font-weight:600;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase;padding:18px 10px 6px;margin-top:4px}
.sb-nav{flex:1;padding:8px 10px 8px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--tx2);transition:all .15s;margin-bottom:4px}
.ni:hover{background:var(--bg-h);color:var(--tx)}.ni.on{background:var(--bg-a);color:var(--tx);font-weight:500}
.ni-e{width:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.85}
.sb-bot{padding:8px;border-top:1px solid var(--br)}
.lang-row{display:flex;gap:4px;margin-bottom:4px}
.lbtn{flex:1;padding:5px;font-size:11px;border-radius:var(--r);border:1px solid var(--br);background:transparent;color:var(--tx2);cursor:pointer;font-family:inherit}
.lbtn.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.t-btn,.so-btn{width:100%;padding:7px 10px;font-size:12px;border:none;background:transparent;color:var(--tx3);cursor:pointer;font-family:inherit;border-radius:var(--r);text-align:left;display:flex;align-items:center;gap:8px;margin-top:4px;transition:color .15s}
.t-btn:hover{background:var(--bg-h);color:var(--tx)}.so-btn:hover{background:var(--bg-h);color:var(--re)}
#main{flex:1;overflow:auto;background:var(--bg)}
.page-content{max-width:900px;margin:0 auto;padding:40px 60px}
.ph{font-size:30px;font-weight:700;margin-bottom:4px;line-height:1.2;display:flex;align-items:center;gap:10px}
.psub{font-size:13px;color:var(--tx3);margin-bottom:28px}
.sh{font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase;margin:24px 0 12px}
.shr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.met{background:var(--bg-c);border-radius:10px;padding:16px 18px 14px;border:1px solid var(--br)}
.mv{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.ml{font-size:11px;color:var(--tx2);margin-top:8px;text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.cg{color:var(--gr)}.cb{color:var(--ac)}.ca{color:var(--ye)}.cr{color:var(--re)}
.bdg{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:var(--r)}
.bs{background:var(--gr-bg);color:var(--gr)}.bi{background:var(--ac-bg);color:var(--ac)}.bw{background:var(--ye-bg);color:var(--ye)}.bx{background:var(--bg-a);color:var(--tx2)}.bd{background:var(--re-bg);color:var(--re)}
.pb{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:var(--r)}
.pbp1{background:var(--re-bg);color:var(--re)}.pbp2{background:var(--ye-bg);color:var(--ye)}.pbp3{background:var(--ac-bg);color:var(--ac)}
.tw{background:var(--bg-c);border-radius:var(--r2);border:1px solid var(--br);overflow:hidden;margin-bottom:20px}
table{width:100%;border-collapse:collapse}
thead{background:var(--bg-sb)}
th{padding:8px 12px;font-size:12px;color:var(--tx2);font-weight:500;text-align:left;border-bottom:1px solid var(--br);white-space:nowrap}
td{padding:8px 12px;font-size:13px;border-bottom:1px solid var(--br);color:var(--tx);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg-h)}
.erow>td{padding:0!important;border-bottom:1px solid var(--br)!important}
.erow-in{background:var(--ac-bg);padding:14px 16px;border-left:3px solid var(--ac)}
button{font-family:'Inter',sans-serif;font-size:13px;padding:6px 12px;border-radius:var(--r);border:1px solid var(--br);background:var(--bg);color:var(--tx);cursor:pointer}
button:hover{background:var(--bg-h)}.btn-add{background:var(--tx);color:var(--bg);border-color:var(--tx)}.btn-add:hover{opacity:.85}
.btn-del{background:none;border:none;color:var(--tx3);cursor:pointer;padding:4px;font-size:13px}.btn-del:hover{color:var(--re)}
.btn-sm{font-size:12px;padding:3px 8px;border-radius:var(--r)}
.fbox{background:var(--ac-bg);border:1px solid var(--ac);border-radius:var(--r2);padding:16px;margin-bottom:16px;border-left:3px solid var(--ac)}
.fbox-t{font-weight:600;font-size:13px;color:var(--ac);margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px;margin-bottom:12px}
.fg label,.fg2 label{display:block;font-size:11px;color:var(--tx2);margin-bottom:5px;font-weight:500}
.fg input,.fg select,.fg2 input,.fg2 select,.fg2 textarea{width:100%;padding:7px 10px;border:1px solid var(--br);border-radius:var(--r);font-size:13px;font-family:inherit;color:var(--tx);outline:none;background:var(--bg-i)}
.fg input:focus,.fg select:focus,.fg2 input:focus,.fg2 select:focus,.fg2 textarea:focus{border-color:var(--ac)}
.fg2 textarea{resize:vertical}
.pcgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.pcc{border-radius:var(--r);padding:10px 4px;text-align:center}
.pcc.clickable{cursor:pointer}.pcc.clickable:hover{opacity:.8}
.pcc-on{background:var(--gr-bg);border:1px solid #c4dfcc}.pcc-on .pcc-n,.pcc-on .pcc-s{color:var(--gr)}
.pcc-a{font-size:10px;margin-top:4px;opacity:.85;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pcc-warn{background:var(--ye-bg);border:1px solid #e8d5a0}.pcc-warn .pcc-n,.pcc-warn .pcc-s{color:var(--ye)}
.pcc-off{background:var(--re-bg);border:1px solid #f0c4c4}.pcc-off .pcc-n,.pcc-off .pcc-s{color:var(--re)}
.pcc-n{font-size:12px;font-weight:600}.pcc-s{font-size:10px;opacity:.8;margin-top:1px}
.tlist{background:var(--bg-c);border-radius:var(--r2);border:1px solid var(--br);overflow:hidden;margin-bottom:16px}
.trow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--br)}
.trow:last-child{border:none}.trow:hover{background:var(--bg-h)}.trow.done{opacity:.5}
.tcheck{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--br2);cursor:pointer!important;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;pointer-events:all!important;z-index:1;position:relative}
.tcheck:hover{border-color:var(--ac)}.tcheck.on{background:var(--gr);border-color:var(--gr);color:#fff}.tcheck.ip{background:var(--ye-bg);border-color:var(--ye);color:var(--ye)}
.ttxt{flex:1;font-size:13px}.ttxt.s{text-decoration:line-through;color:var(--tx3)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--br);background:var(--bg);cursor:pointer;color:var(--tx2)}
.pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pc-col{background:var(--bg-sb);border-radius:var(--r2);padding:12px;border:1px solid var(--br)}
.pc-col-h{font-size:12px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.pc-cnt{font-size:11px;background:var(--bg-a);border-radius:20px;padding:2px 7px;color:var(--tx2)}
.pc-card{background:var(--bg-c);border:1px solid var(--br);border-radius:var(--r);padding:9px 10px;margin-bottom:6px}
.pc-name{font-weight:600;font-size:13px;margin-bottom:2px}.pc-meta{font-size:11px;color:var(--tx3);margin-bottom:6px}
.rlayout{display:grid;grid-template-columns:200px 1fr;gap:16px}
.ritem{padding:8px 10px;border-radius:var(--r);cursor:pointer;margin-bottom:2px}
.ritem:hover{background:var(--bg-h)}.ritem.on{background:var(--bg-a)}
.rview{background:var(--bg-c);border:1px solid var(--br);border-radius:var(--r2);padding:24px}
.rsnap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.rsc{background:var(--bg-sb);border-radius:var(--r);padding:12px;text-align:center;border:1px solid var(--br)}
.rsv{font-size:22px;font-weight:700}.rsl{font-size:11px;color:var(--tx2)}
.rsec{margin-bottom:16px}
.rsec-t{font-size:11px;font-weight:600;color:var(--tx2);border-bottom:1px solid var(--br);padding-bottom:4px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.rsec-b{font-size:13px;color:var(--tx);line-height:1.7;white-space:pre-wrap}
.rempty{display:flex;align-items:center;justify-content:center;height:180px;font-size:13px;color:var(--tx3);border:1px dashed var(--br);border-radius:var(--r2)}
.code-card{background:var(--bg-c);border:1px solid var(--br);border-radius:var(--r2);padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.code-role{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;text-transform:uppercase;width:100px;text-align:center;display:inline-block}
.code-val{flex:1;font-family:monospace;font-size:13px;font-weight:600;color:var(--tx);background:var(--bg-sb);padding:6px 10px;border-radius:var(--r);border:1px solid var(--br)}
.code-used{text-decoration:line-through;color:var(--tx3)}.code-status{font-size:12px;color:var(--tx3)}
.player-wrap{max-width:560px;margin:0 auto}
.player-hero{background:linear-gradient(135deg,#1a2332,#0f7b6c);border-radius:12px;padding:28px 24px;color:#fff;margin-bottom:20px;text-align:center}
.player-char{font-size:26px;font-weight:700;margin-bottom:4px}.player-server{font-size:13px;opacity:.8;margin-bottom:16px}
.player-status-big{display:inline-block;font-size:13px;font-weight:600;padding:5px 16px;border-radius:20px;background:rgba(255,255,255,.2)}
.player-card{background:var(--bg-c);border:1px solid var(--br);border-radius:var(--r2);padding:18px;margin-bottom:12px}
.player-card-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);margin-bottom:12px}
.player-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--br);font-size:13px}
.player-row:last-child{border:none}.player-key{color:var(--tx2)}.player-val{font-weight:600}
.player-note{background:var(--gr-bg);border:1px solid #c4dfcc;border-radius:var(--r);padding:12px;font-size:13px;color:var(--gr);line-height:1.6}
.player-none{text-align:center;padding:60px 20px;color:var(--tx3)}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;overflow:hidden;line-height:1;letter-spacing:0;text-transform:uppercase}
.nodata{padding:20px;text-align:center;font-size:13px;color:var(--tx3)}
.tip{font-size:12px;color:var(--tx3);margin-bottom:16px}
.info-tag{font-size:12px;background:var(--ac-bg);color:var(--ac);padding:4px 10px;border-radius:20px;display:inline-block;margin-bottom:12px}
.setup-box{background:var(--ye-bg);border:1px solid var(--br2);border-radius:var(--r2);padding:20px}
.setup-box h3{color:var(--ye);margin-bottom:8px}.setup-box code{background:var(--bg);border:1px solid var(--br);padding:2px 6px;border-radius:var(--r);font-size:12px;display:block;margin:4px 0;word-break:break-all}

#toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast-msg{padding:14px 20px;border-radius:8px;font-size:14px;font-weight:500;max-width:420px;box-shadow:0 6px 24px rgba(0,0,0,.5);pointer-events:all;animation:slideIn .2s ease;display:flex;justify-content:space-between;align-items:center;gap:8px}
.toast-ok{background:#0f7b6c;color:#fff}.toast-err{background:#c0392b;color:#fff}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ─── Prototype design overlay (matches Lucky 7 redesign) ─── */
.page-content{max-width:1100px;margin:0 auto;padding:36px 44px 80px}
th{padding:9px 14px;font-size:11px;color:var(--tx3);font-weight:500;text-align:left;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--br);background:var(--bg-sb)}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--br);color:var(--tx);vertical-align:middle}
.tw{border-radius:10px}
.tw tbody tr:last-child td{border-bottom:none}
.tw tbody tr:hover td{background:var(--bg-h)}
.btn-add{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:6px;border:1px solid var(--ac-bord);background:var(--ac-bg);color:var(--ac-strong);font-weight:500;font-size:12px}
.btn-add:hover{background:rgba(194,160,74,.20);opacity:1}
.btn-sm{padding:5px 11px;font-size:11px;border-radius:6px;border:1px solid var(--br2);background:var(--bg-c);color:var(--tx2)}
.btn-sm:hover{border-color:var(--br-strong);color:var(--tx)}
.bdg{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:5px;white-space:nowrap}
.met{transition:border-color .15s}
.met:hover{border-color:var(--br2)}
.pcc{border-radius:8px}
.fbox{border-radius:10px}
.shr{align-items:center}

/* ─── Dashboard redesign components ─── */
.metric-grid .metric{position:relative;background:var(--bg-c);border:1px solid var(--br);border-radius:10px;padding:16px 18px 14px;overflow:hidden}
.metric-label{font-size:11px;color:var(--tx2);letter-spacing:.08em;text-transform:uppercase;font-weight:500;margin-bottom:14px}
.metric-row{display:flex;align-items:baseline;gap:8px}
.metric-value{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--tx);font-variant-numeric:tabular-nums}
.metric-unit{font-size:13px;color:var(--tx2);font-weight:500}
.metric-delta{margin-top:8px;font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.metric-delta .arrow{color:var(--ok);font-weight:600}
.metric-delta .arrow.down{color:var(--re)}
.metric-delta .arrow.neutral{color:var(--tx3)}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:24px}
.panel{background:var(--bg-c);border:1px solid var(--br);border-radius:10px;padding:18px 20px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;margin-top:8px}
.section-title{font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.14em;text-transform:uppercase}
.section-title .count{display:inline-block;margin-left:6px;font-size:11px;color:var(--tx3);font-weight:500}
.presence-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.presence-chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;background:var(--bg-c);border:1px solid var(--br);border-radius:20px}
.presence-chip-name{font-size:12px;font-weight:500;line-height:1.1}
.presence-chip-role{font-size:10px;color:var(--tx3)}
.task-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--br);transition:background .12s}
.task-row:last-child{border-bottom:none}
.task-row:hover{background:var(--bg-h)}
.task-title{flex:1;font-size:13px;color:var(--tx)}
.task-owner{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2)}
.pbadge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;letter-spacing:.02em}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:5px;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%}
.pc{background:var(--bg-c);border:1px solid var(--br);border-radius:8px;text-align:center;cursor:pointer;transition:background .12s,border-color .12s;position:relative}
.pc-num{font-size:13px;font-weight:600}
.pc[data-st="Online"]{border-color:rgba(77,154,138,.25)}
.pc[data-st="Online"] .pc-num{color:var(--ok)}
.pc[data-st="Warning"] .pc-num{color:var(--warn)}
.pc[data-st="Offline"]{background:var(--bg)}
.pc[data-st="Offline"] .pc-num{color:var(--tx3)}
.pc-legend{display:flex;gap:18px;font-size:11px;color:var(--tx2)}
.pc-legend-item{display:flex;align-items:center;gap:6px}
.pc-legend-item .dot{width:7px;height:7px;border-radius:50%}
.rep-list{background:var(--bg-c);border:1px solid var(--br);border-radius:10px;overflow:hidden}
.rep-row{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;border-bottom:1px solid var(--br);cursor:pointer;transition:background .12s}
.rep-row:last-child{border-bottom:none}
.rep-row:hover{background:var(--bg-h)}
.rep-date{width:120px;flex-shrink:0;font-size:11px;color:var(--tx3);padding-top:2px}
.rep-body{flex:1;min-width:0}
.rep-title{font-size:13px;font-weight:500;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.rep-summary{font-size:12px;color:var(--tx2);line-height:1.55}
@media(max-width:820px){.two-col{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,1fr)!important}}

/* ─── PC Command page ─── */
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid var(--br);background:var(--bg);color:var(--tx2);cursor:pointer;transition:all .12s}
.pill:hover{color:var(--tx);border-color:var(--br2)}
.pill.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:500}
.input{background:var(--bg-c);border:1px solid var(--br);border-radius:6px;padding:6px 12px;font-size:12px;color:var(--tx);min-width:200px;outline:none;font-family:inherit}
.input:focus{border-color:var(--ac)}
.pc-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:24px}
.pc-grid .pc{min-height:auto}
.pc.selected{outline:1.5px solid var(--ac);outline-offset:-1px}
.pc-status-dot{width:7px;height:7px;border-radius:50%;position:absolute;top:8px;right:8px}
.pc[data-st="Online"] .pc-status-dot{background:var(--ok);box-shadow:0 0 8px rgba(77,154,138,.4)}
.pc[data-st="Warning"] .pc-status-dot{background:var(--warn)}
.pc[data-st="Offline"] .pc-status-dot{background:var(--tx4)}
.pc-player{font-size:10px;color:var(--tx3);margin-top:4px;height:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-detail{background:var(--bg-c);border:1px solid var(--br);border-radius:10px;padding:18px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px 14px;margin-bottom:24px}
.pc-detail-cell{font-size:12px;color:var(--tx2)}
.pc-detail-cell strong{display:block;font-size:14px;color:var(--tx);margin-top:2px;font-weight:500}
@media(max-width:820px){.pc-grid{grid-template-columns:repeat(5,1fr)}.pc-detail{grid-template-columns:repeat(2,1fr)}}

/* ─── Daily Checklist redesign ─── */
.cl-block{margin-bottom:18px}
.cl-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
.cl-list{background:var(--bg-c);border:1px solid var(--br);border-radius:10px;overflow:hidden}
.cl-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--br);cursor:pointer;transition:background .12s}
.cl-row:last-child{border-bottom:none}
.cl-row:hover{background:var(--bg-h)}
.cl-row.done .cl-label{color:var(--tx3);text-decoration:line-through;text-decoration-color:var(--tx4)}
.cl-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--br2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s}
.cl-check.on{background:var(--ac);border-color:var(--ac)}
.cl-check.on::after{content:"";width:7px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.cl-label{font-size:13px;color:var(--tx);flex:1}

/* ─── Tasks redesign ─── */
.task-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--br2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s}
.task-check.on{background:var(--ac);border-color:var(--ac)}
.task-check.on::after{content:"";width:7px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.task-check.ip{border-color:var(--ye);background:var(--ye-bg)}
.task-meta{font-size:11px;color:var(--tx3)}
.empty{padding:60px 20px;text-align:center;color:var(--tx3);border:1px dashed var(--br2);border-radius:10px;font-size:13px}

/* ─── Recruitment kanban ─── */
.kanban{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.kcol{background:var(--bg-sb);border:1px solid var(--br);border-radius:10px;padding:10px}
.kcol-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px}
.kcol-name{font-size:11px;font-weight:600;color:var(--tx)}
.kcol-cnt{font-size:11px;color:var(--tx3);background:var(--bg-a);padding:1px 8px;border-radius:10px}
.kcard{background:var(--bg-c);border:1px solid var(--br);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.kcard:hover{border-color:var(--br2)}
.kcard-name{font-size:13px;font-weight:500}
@media(max-width:820px){.kanban{grid-template-columns:repeat(2,1fr)}}

/* ─── Daily Reports list ─── */
.rep-list .rep-row{flex-direction:row}
.rep-list .rep-date{width:auto;min-width:84px}

/* ─── Invite Codes redesign ─── */
.code-list{display:flex;flex-direction:column;gap:8px}
.code-card{display:flex;align-items:center;gap:14px;background:var(--bg-c);border:1px solid var(--br);border-radius:10px;padding:12px 16px}
.code-val{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--tx);flex:1;padding:7px 12px;background:var(--bg);border:1px solid var(--br);border-radius:6px}
.code-val.used{text-decoration:line-through;color:var(--tx3)}

/* ─── Needs attention panel ─── */
.attn-panel{border-left:3px solid var(--re);margin-bottom:28px;padding:16px 20px}
.attn-block{padding:11px 0;border-bottom:1px solid var(--br)}
.attn-block:last-child{border-bottom:none;padding-bottom:0}
.attn-block:first-of-type{padding-top:4px}
.attn-item{font-size:12px;color:var(--tx2);padding:3px 0 0 25px}
.attn-more{font-size:11px;color:var(--tx3);padding:3px 0 0 25px}

/* ─── Lineage Ops ─── */
.game-pc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.game-pc{background:var(--bg-c);border:1px solid var(--br);border-radius:8px;padding:10px 12px;cursor:pointer;transition:border-color .12s}
.game-pc:hover{border-color:var(--br2)}
.game-pc.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.game-pc.empty{opacity:.5}
.game-pc.empty:hover{opacity:.8}

/* ─── HR Attendance ─── */
.att-clock{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.att-btn{flex:1;min-width:120px;padding:14px 18px;border-radius:10px;border:1.5px solid var(--br2);background:var(--bg-c);cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;color:var(--tx2);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.att-btn:hover{border-color:var(--ac);color:var(--ac)}
.att-btn.att-in{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.att-btn.att-out{border-color:var(--re);background:var(--re-bg);color:var(--re)}
.att-btn.att-break{border-color:var(--ye);background:var(--ye-bg);color:var(--ye)}
.att-btn:disabled{opacity:.4;cursor:not-allowed}
.att-today{background:var(--bg-c);border:1px solid var(--br);border-radius:10px;padding:18px 20px;margin-bottom:24px}
.att-timeline{display:flex;gap:0;margin-top:12px;position:relative}
.att-tl-item{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
.att-tl-item::before{content:'';position:absolute;top:10px;left:-50%;right:50%;height:2px;background:var(--br2);z-index:0}
.att-tl-item:first-child::before{display:none}
.att-tl-dot{width:20px;height:20px;border-radius:50%;background:var(--bg-a);border:2px solid var(--br2);position:relative;z-index:1;display:flex;align-items:center;justify-content:center;font-size:9px}
.att-tl-dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.att-tl-dot.break{background:var(--ye);border-color:var(--ye);color:#fff}
.att-tl-label{font-size:10px;color:var(--tx3);margin-top:4px;text-align:center}
.att-tl-time{font-size:11px;font-weight:600;color:var(--tx);margin-top:2px}
.att-tab-row{display:flex;gap:6px;margin-bottom:16px}
.att-tab{padding:6px 14px;border-radius:20px;border:1px solid var(--br);background:var(--bg);color:var(--tx2);font-size:12px;cursor:pointer;font-family:inherit}
.att-tab.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:500}

/* ─── Trust Score Board ─── */
.trust-grid{display:grid;gap:8px}
.trust-row-header{display:grid;grid-template-columns:2fr 80px 80px 80px 120px 120px;gap:8px;padding:8px 14px;font-size:11px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.trust-row{display:grid;grid-template-columns:2fr 80px 80px 80px 120px 120px;gap:8px;align-items:center;background:var(--bg-c);border:1px solid var(--br);border-radius:8px;padding:10px 14px;transition:border-color .12s}
.trust-row:hover{border-color:var(--br2)}
.trust-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.trust-status{font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.trust-status.good{color:var(--ok)}.trust-status.warn{color:var(--warn)}.trust-status.bad{color:var(--re)}
.trust-warn{color:var(--re);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.trust-tp{color:var(--ac);font-weight:700;font-size:14px}

/* ─── Drag & Drop Shift ─── */
.dnd-container{display:grid;grid-template-columns:200px 1fr;gap:20px;margin-top:16px}
.dnd-pool{background:var(--bg-c);border:1px solid var(--br);border-radius:10px;padding:12px}
.dnd-pool-title{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.dnd-chip{background:var(--bg-sb);border:1px solid var(--br);border-radius:6px;padding:7px 10px;font-size:12px;font-weight:500;cursor:grab;margin-bottom:6px;display:flex;align-items:center;gap:8px;user-select:none;transition:border-color .12s}
.dnd-chip:hover{border-color:var(--ac)}
.dnd-chip.dragging{opacity:.4;cursor:grabbing}
.dnd-slots{display:flex;flex-direction:column;gap:10px}
.dnd-slot{background:var(--bg-c);border:1.5px dashed var(--br2);border-radius:8px;padding:12px 14px;min-height:52px;display:flex;align-items:center;gap:10px;transition:border-color .15s;flex-wrap:wrap}
.dnd-slot.dragover{border-color:var(--ac);background:var(--ac-bg)}
.dnd-slot-label{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;min-width:70px;flex-shrink:0}
.dnd-assigned{background:var(--bg-sb);border:1px solid var(--br);border-radius:5px;padding:5px 9px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;cursor:pointer}
.dnd-assigned:hover{border-color:var(--re);color:var(--re)}
.dnd-empty{font-size:11px;color:var(--tx4);font-style:italic}

/* ─── PC Status game colors ─── */
.pc-game-lin{border-color:rgba(100,149,237,.35)!important;background:rgba(100,149,237,.06)!important}
.pc-game-lin .pc-num{color:#6495ED!important}
.pc-game-map{border-color:rgba(255,165,0,.35)!important;background:rgba(255,165,0,.06)!important}
.pc-game-map .pc-num{color:#FFA500!important}
.pc-game-lin[data-st="Online"]{border-color:rgba(100,149,237,.55)!important}
.pc-game-map[data-st="Online"]{border-color:rgba(255,165,0,.55)!important}

/* ─── Onboarding checklist ─── */
.ob-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.ob-progress{height:6px;background:var(--bg-a);border-radius:3px;overflow:hidden;flex:1;min-width:160px}
.ob-progress-fill{height:100%;background:var(--ac);border-radius:3px;transition:width .3s}
.ob-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.ob-card{background:var(--bg-c);border:1px solid var(--br);border-radius:10px;padding:14px 16px;display:flex;align-items:flex-start;gap:11px;cursor:pointer;transition:border-color .12s}
.ob-card:hover{border-color:var(--br2)}
.ob-card.done{background:var(--gr-bg);border-color:rgba(77,154,138,.3)}
.ob-card.done .ob-label{color:var(--tx2)}
.ob-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--br2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s;margin-top:1px}
.ob-check.on{background:var(--gr);border-color:var(--gr)}
.ob-check.on::after{content:"";width:8px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(0,-1px)}
.ob-label{font-size:13px;color:var(--tx);line-height:1.5;font-weight:500}
.ob-tag{display:inline-block;font-size:9px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--ac-bg);color:var(--ac);margin-left:6px;text-transform:uppercase;letter-spacing:.04em;vertical-align:middle}
.ob-disabled{opacity:.55;pointer-events:none}

/* ─── Manual accordion (Notion style) ─── */
.man-sec{background:var(--bg-c);border:1px solid var(--br);border-radius:10px;margin-bottom:12px;overflow:hidden}
.man-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;background:var(--bg-sb);transition:background .12s;user-select:none}
.man-head:hover{background:var(--bg-h)}
.man-title{font-size:14px;font-weight:600;color:var(--ac-strong);font-family:ui-monospace,monospace;letter-spacing:.02em}
.man-arrow{color:var(--tx3);transition:transform .2s;font-size:12px}
.man-arrow.open{transform:rotate(180deg)}
.man-body{padding:16px 22px 20px}
.man-body ul{margin:0 0 6px;padding-left:20px}
.man-body li{font-size:13px;color:var(--tx);line-height:1.9;margin-bottom:2px}
.man-subtitle{font-size:13px;font-weight:700;color:var(--tx);margin:14px 0 6px}
.man-subtitle:first-child{margin-top:0}
.man-warn{background:var(--ye-bg);border-left:3px solid var(--warn);border-radius:6px;padding:9px 14px;font-size:12px;color:var(--warn);font-family:ui-monospace,monospace;margin:10px 0 4px}

/* ─── Onboarding flat guide ─── */
.guide-card{background:var(--bg-c);border:1px solid var(--br);border-radius:10px;padding:18px 22px;margin-bottom:12px}
.guide-title{font-size:14px;font-weight:600;color:var(--ac-strong);font-family:ui-monospace,monospace;letter-spacing:.02em;margin-bottom:12px}
.guide-card ul{margin:0 0 4px;padding-left:20px}
.guide-card li{font-size:13px;color:var(--tx);line-height:1.9;margin-bottom:2px}
.guide-sub{font-size:13px;font-weight:700;color:var(--tx);margin:16px 0 6px}
.guide-sub:first-of-type{margin-top:0}
.ob-divider{display:flex;align-items:center;gap:12px;margin:30px 0 20px;font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.ob-divider::before,.ob-divider::after{content:"";flex:1;height:1px;background:var(--br)}

/* ─── Shift Board (Japan-style weekly drag-drop) ─── */
.sh-wk{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sh-wk-label{font-size:14px;font-weight:600;min-width:170px;text-align:center;font-variant-numeric:tabular-nums}
.sh-pool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 14px;background:var(--bg-sb);border:1px solid var(--br);border-radius:10px;margin-bottom:16px}
.sh-pool-lbl{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;margin-right:2px}
.sh-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;font-size:12px;font-weight:500;user-select:none;background:var(--bg-c);border:1px solid var(--br2);border-left-width:3px;border-left-color:var(--tx4)}
.sh-chip.g-lin{border-left-color:#6495ED}
.sh-chip.g-map{border-left-color:#FFA500}
.sh-chip.drag{cursor:grab}
.sh-chip.drag:active{cursor:grabbing}
.sh-chip .sh-grip{opacity:.4;font-size:13px;cursor:grab}
.sh-chip .sh-gdot{width:9px;height:9px;border-radius:50%;background:var(--tx4);cursor:pointer;flex-shrink:0}
.sh-chip .sh-gdot.g-lin{background:#6495ED}
.sh-chip .sh-gdot.g-map{background:#FFA500}
.sh-chip .sh-x{cursor:pointer;opacity:.5;font-size:13px;line-height:1}
.sh-chip .sh-x:hover{opacity:1;color:var(--re)}
.sh-grid{display:grid;grid-template-columns:104px 1fr 1fr;gap:8px}
.sh-head{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:8px;font-size:12px;font-weight:600}
.sh-head.day{background:var(--ye-bg);color:var(--ye)}
.sh-head.night{background:var(--ac-bg);color:var(--ac)}
.sh-rowlbl{display:flex;align-items:center;font-size:12px;font-weight:600;color:var(--tx2)}

// Keep the login session fresh — refresh token whenever the tab regains focus.
// This prevents the "save fails until hard refresh" problem caused by an
// expired token after the tab has been idle/backgrounded.
let _lastSessionCheck = 0;
async function refreshSessionIfNeeded(){
  const now = Date.now();
  if(now - _lastSessionCheck < 30000) return; // throttle: at most once per 30s
  _lastSessionCheck = now;
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(!session){
      // Refresh token also expired — user needs to log in again
      if(typeof toast==='function') toast('Session expired — please log in again','err');
    }
  }catch(e){ console.warn('Session refresh failed:', e); }
}

});

// ── AUTO UPDATE CHECK ──────────────────────────────────────────────────────
// GitHub Pages caches the old file in the browser, so a new deploy isn't seen
// until a hard refresh. This quietly fetches the live file, reads its build
// number, and if it's newer than what's running, shows a one-tap Reload banner.
let _lastUpdateCheck = 0;
function runningBuild(){
  const el=document.getElementById('app-version');
  const m=(el?el.textContent:'').match(/Build:\s*([0-9-]+)/);
  return m?m[1]:null;
}
function showUpdateBanner(){
  if(document.getElementById('update-banner')) return;
  const ko=(typeof S!=='undefined'&&S.lang==='ko');
  const b=document.createElement('div');
  b.id='update-banner';
  b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:10000;background:#c2a04a;color:#1a1407;padding:12px 16px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:14px;font-size:13px;font-weight:600;animation:slideIn .2s ease';

    +'<button onclick="location.replace(location.pathname+\'?_=\'+Date.now())" style="background:#04160c;color:#fff;border:none;padding:7px 14px;border-radius:6px;font-weight:600;cursor:pointer;font-size:12px">'+(ko?'새로고침':'Reload now')+'</button>';
  document.body.appendChild(b);
}
async function checkForUpdate(){
  const now=Date.now();
  if(now - _lastUpdateCheck < 60000) return; // at most once per minute
  _lastUpdateCheck = now;
  try{
    const res=await fetch(location.pathname+'?_cb='+now, {cache:'no-store'});
    if(!res.ok) return;
    const txt=await res.text();
    const m=txt.match(/Build:\s*([0-9-]+)/);
    const live=m?m[1]:null;
    const cur=runningBuild();
    if(live && cur && live!==cur) showUpdateBanner();
  }catch(e){ /* offline or fetch blocked — ignore */ }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkForUpdate(); });

const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ac=n=>(['#185FA5','#0F6E56','#854F0B','#791F1F','#534AB7','#993556','#444441'])[(n||'?').charCodeAt(0)%7];
const sc=s=>({Active:'bs',Online:'bs',Done:'bs',Completed:'bs',Hired:'bs','In Progress':'bi',Interview:'bi',Trial:'bw',Warning:'bw',Applied:'bw',Inactive:'bx',Todo:'bx',Offline:'bd',Paused:'bd'}[s]||'bx');
const bdg=s=>`<span class="bdg ${sc(s)}">${s}</span>`;
const pb=p=>`<span class="pb pb${p.toLowerCase()}">${p}</span>`;
const av=(n,i,sz=30,url=null)=>{const c=ac(n);const txt=((i&&i.trim())?i.trim():(n||'?')).slice(0,2).toUpperCase();if(url)return`<div class="av" style="width:${sz}px;height:${sz}px;border:1.5px solid ${c};overflow:hidden;flex-shrink:0;border-radius:50%"><img src="${url}" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.parentElement.outerHTML='<div class=av style=width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.38)}px;background:${c}22;border:1.5px solid ${c};color:${c}>${txt}</div>'"></div>`;return`<div class="av" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.38)}px;background:${c}22;border:1.5px solid ${c};color:${c}">${txt}</div>`;};
function trend(end,n=12){end=+end||0;const a=[];let v=Math.max(0,Math.round(end*0.55));for(let i=0;i<n-1;i++){v+=((end-v)/(n-i))+(Math.random()*2-1);a.push(Math.max(0,Math.round(v)));}a.push(end);return a;}
function spark(data,color){if(!data||data.length<2)return'';const max=Math.max(...data),min=Math.min(...data),range=max-min||1;const w=100,h=28,step=w/(data.length-1);const pts=data.map((v,i)=>`${(i*step).toFixed(1)},${(h-((v-min)/range)*h*0.85-2).toFixed(1)}`).join(' ');const area=`M0,${h} L${data.map((v,i)=>`${(i*step).toFixed(1)},${(h-((v-min)/range)*h*0.85-2).toFixed(1)}`).join(' L')} L${w},${h} Z`;return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" width="100%" height="${h}" style="position:absolute;inset:auto 0 0 0;height:28px;opacity:.6;pointer-events:none"><path d="${area}" fill="${color}" fill-opacity="0.12"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.2" stroke-opacity="0.65" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}

let signupRole = 'staff';

function showTab(tab){
  document.getElementById('tab-in').style.display=tab==='in'?'block':'none';
  document.getElementById('tab-up').style.display=tab==='up'?'block':'none';
  document.querySelectorAll('.auth-tab').forEach((b,i)=>b.classList.toggle('on',['in','up'][i]===tab));

function pickRole(r){
  signupRole=r;
  document.querySelectorAll('.role-opt').forEach(el=>el.classList.remove('on'));
  document.getElementById(`ropt-${r}`).classList.add('on');
  const inv=document.getElementById('invite-field');

function showMsg(msg,type='err'){
  const el=document.getElementById('auth-msg');
  el.className=type==='ok'?'auth-ok':'auth-err';
  el.textContent=msg;el.style.display='block';
}

async function signIn(){
  const email=document.getElementById('si-email').value.trim();
  const pass=document.getElementById('si-pass').value;
  if(!email||!pass){showMsg('Please enter email and password.');return;}
  const btn=document.getElementById('si-btn');
  btn.textContent='Signing in...';btn.disabled=true;
  try{
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('Connection timeout. Check your internet and try again.')),10000));
    const login=sb.auth.signInWithPassword({email,password:pass});
    const {error}=await Promise.race([login,timeout]);
    if(error){showMsg(error.message);btn.textContent='Sign In';btn.disabled=false;}
  }catch(e){showMsg(e.message);btn.textContent='Sign In';btn.disabled=false;}
}

async function signUp(){
  const name=document.getElementById('su-name').value.trim();
  const email=document.getElementById('su-email').value.trim();
  const pass=document.getElementById('su-pass').value;
  const code=document.getElementById('su-code').value.trim();
  if(!name||!email||!pass){showMsg('Please fill in all fields.');return;}
  if(pass.length<6){showMsg('Password must be at least 6 characters.');return;}
  if(!code){showMsg('An invite code is required to sign up. Please ask your manager for one.');return;}
  document.getElementById('su-btn').textContent='Creating account...';
  document.getElementById('su-btn').disabled=true;
  const {error}=await sb.auth.signUp({email,password:pass,options:{data:{name}}});
  if(error){showMsg(error.message);document.getElementById('su-btn').textContent='Create Account';document.getElementById('su-btn').disabled=false;return;}
  await new Promise(r=>setTimeout(r,1500));
  const {data:result}=await sb.rpc('redeem_invite_code',{p_code:code});
  if(result==='invalid'){showMsg('That invite code is invalid or already used. Your account has no access until a manager assigns your role.',null);document.getElementById('su-btn').textContent='Create Account';document.getElementById('su-btn').disabled=false;return;}
  showMsg('Account created! Check your email to confirm, then sign in.','ok');
  document.getElementById('su-btn').textContent='Create Account';
  document.getElementById('su-btn').disabled=false;
}

async function uploadAvatar(file){
  if(!file||!S.user) return;
  if(file.size>3*1024*1024){toast('Image must be under 3MB','err');return;}
  const clearToasts=()=>document.querySelectorAll('.toast-msg').forEach(t=>t.remove());
  const loadingToast=document.createElement('div');
  loadingToast.className='toast-msg toast-ok';
  loadingToast.innerHTML='<span>Uploading photo...</span>';
  document.getElementById('toast').appendChild(loadingToast);
  try{
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
    const path=`${S.user.id}/avatar.${ext}`;
    // Upload to Supabase Storage — no contentType option (inferred from File object)
    const {data:upData,error:upErr}=await sb.storage.from('avatars').upload(path,file,{upsert:true,cacheControl:'3600'});
    if(upErr){clearToasts();toast('Upload error: '+upErr.message,'err');console.error('[avatar upload]',upErr);return;}
    // Get public URL
    const {data:urlData}=sb.storage.from('avatars').getPublicUrl(path);
    const url=(urlData?.publicUrl||'')+`?t=${Date.now()}`;
    if(!url){clearToasts();toast('Could not get image URL','err');return;}
    // Save URL to profile
    const {error:dbErr}=await sb.from('user_profiles').update({avatar_url:url}).eq('id',S.user.id);
    if(dbErr){clearToasts();toast('Saved but DB error: '+dbErr.message,'err');return;}
    S.profile.avatar_url=url;
    clearToasts();
    toast('Photo updated ✓');
    // Re-render sidebar avatar
    setSidebarAvatar();
    render();
  }catch(e){clearToasts();toast('Upload failed: '+e.message,'err');console.error('[uploadAvatar]',e);}
}
function setSidebarAvatar(){
  const sz=42;
  const avHtml=av(S.profile.name,S.profile.initials,sz,S.profile.avatar_url||null);
  const avEl=document.getElementById('sb-avatar');
  if(!avEl) return;
  avEl.innerHTML=`<div style="position:relative;display:inline-block;cursor:pointer;flex-shrink:0" onclick="document.getElementById('av-upload').click()" title="Click to change photo">`
    +avHtml
    +`<div style="position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;font-size:15px;opacity:0;transition:.2s" onmouseover="this.style.background='rgba(0,0,0,.55)';this.style.opacity='1'" onmouseout="this.style.background='rgba(0,0,0,0)';this.style.opacity='0'">📷</div>`
    +`</div>`
    +`<input type="file" id="av-upload" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="uploadAvatar(this.files[0])">`;
}
function signOut(){
  // NO await anywhere — this function must never hang.
  // 1. Clear Supabase session from storage immediately (synchronous)
  try{
    Object.keys(localStorage).forEach(k=>{
      if(k.startsWith('sb-')||k.toLowerCase().includes('supabase')||k.includes('auth-token')) localStorage.removeItem(k);
    });
    sessionStorage.clear();
  }catch(e){}
  // 2. Fire the server signout in the background (don't wait for it)
  try{ sb.auth.signOut({scope:'local'}); }catch(e){}
  // 3. Force a fresh page load with cache-buster → lands on login screen
  location.replace(location.pathname + '?logout=' + Date.now());
}

// ── ONLINE PRESENCE ───────────────────────────────────────────────────────
let presenceChannel = null;
function setupPresence(){
  if(!S.user||!S.profile) return;
  try{
    if(presenceChannel){ sb.removeChannel(presenceChannel); presenceChannel=null; }
    presenceChannel = sb.channel('lucky7-online', { config:{ presence:{ key:S.user.id } } });
    presenceChannel.on('presence', { event:'sync' }, ()=>{
      const state = presenceChannel.presenceState();
      const users = [];
      Object.values(state).forEach(arr=>{ if(arr&&arr[0]) users.push(arr[0]); });
      S.onlineUsers = users;
      render();
    });
    presenceChannel.subscribe(async (status)=>{
      if(status==='SUBSCRIBED'){
        await presenceChannel.track({
          user_id:S.user.id, name:S.profile.name, initials:S.profile.initials,
          role:S.profile.role, online_at:new Date().toISOString()
        });
      }
    });
  }catch(e){ console.warn('Presence setup failed:', e); }
}
function isOnline(userId){ return S.onlineUsers.some(u=>u.user_id===userId); }

async function onLogin(user){
  try{

function pgDash(){
  const ko=S.lang==='ko';
  const onlinePc=S.pcs.filter(p=>p.status==='Online').length;
  const warnPc=S.pcs.filter(p=>p.status==='Warning').length;
  const offPc=S.pcs.filter(p=>p.status==='Offline').length;
  const totalPc=S.pcs.length||1;
  const uptime=Math.round((onlinePc/totalPc)*100);
  const teamN=S.team.filter(m=>m.status==='Active'||!m.status).length;
  const openT=S.tasks.filter(x=>x.status!=='Done').length;
  const p1=S.tasks.filter(x=>x.priority==='P1'&&x.status!=='Done').length;
  const activeC=S.clients.filter(c=>c.status==='Active').length;
  const rev=S.clients.filter(c=>c.status==='Active').reduce((s,c)=>s+(+c.price||0),0);
  const revFmt=rev>=1000000?'Rp '+(rev/1000000).toFixed(1)+'M':rev>=1000?'Rp '+Math.round(rev/1000)+'k':'Rp '+rev;
  const online=S.team.filter(m=>isOnline(m.id));
  const dateStr=new Date().toLocaleDateString(ko?'ko-KR':'en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

  // metric card
  const metric=(label,value,unit,delta,dir,sparkVal,sparkColor)=>{
    const arrow=dir==='down'?'↓':dir==='neutral'?'·':'↑';
    const acls=dir==='down'?'arrow down':dir==='neutral'?'arrow neutral':'arrow';
    return `<div class="metric">`
      +`<div class="metric-label">${label}</div>`
      +`<div class="metric-row"><div class="metric-value">${value}</div>${unit?`<div class="metric-unit">${unit}</div>`:''}</div>`
      +`<div class="metric-delta"><span class="${acls}">${arrow}</span><span>${delta}</span></div>`
      +(sparkVal!=null?spark(trend(sparkVal),sparkColor||'var(--ac)'):'')
      +`</div>`;
  };
  // priority badge
  const pbadge=p=>{const bg=p==='P1'?'var(--err-bg)':p==='P2'?'var(--warn-bg)':'var(--bg-a)';const c=p==='P1'?'var(--err)':p==='P2'?'var(--warn)':'var(--tx2)';return `<span class="pbadge" style="background:${bg};color:${c}">${p}</span>`;};
  // status badge
  const sbadge=s=>{const m={Done:['var(--ok-bg)','var(--ok)'],'In Progress':['var(--info-bg)','var(--info)'],Todo:['var(--bg-a)','var(--tx2)']};const[bg,c]=m[s]||m.Todo;return `<span class="badge" style="background:${bg};color:${c}"><span class="dot" style="background:${c}"></span>${s}</span>`;};
  // fleet stat
  const fstat=(label,n,c)=>`<div style="flex:1;display:flex;flex-direction:column;gap:2px"><div style="font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1;color:${c};font-variant-numeric:tabular-nums">${n}</div><div style="font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em">${label}</div></div>`;
  // section head
  const shead=(title,count,action,page)=>`<div class="section-head"><div class="section-title">${title}${count!=null?`<span class="count">${count}</span>`:''}</div>${action?`<span ${page?`onclick="goPage('${page}')" `:''}style="font-size:12px;color:var(--tx2);${page?'cursor:pointer':''}" ${page?`onmouseover="this.style.color='var(--ac-strong)'" onmouseout="this.style.color='var(--tx2)'"`:''}>${action} →</span>`:''}</div>`;

  const openTasks=S.tasks.filter(t=>t.status!=='Done').sort((a,b)=>['P1','P2','P3'].indexOf(a.priority)-['P1','P2','P3'].indexOf(b.priority)).slice(0,5);

  // PC mini grid
  const pcGrid=S.pcs.map(p=>`<div class="pc" data-st="${p.status}" ${can('pcs_edit')?`onclick="cyclePC(${p.id})"`:''} style="padding:6px 2px;min-height:32px"><div class="pc-num" style="font-size:11px">${String(p.num).padStart(2,'0')}</div></div>`).join('');

  // checklist sections
  const clItems=S.myChecklist?.items||{};
  const clHtml=['before','during','end'].map(sec=>{
    const items=(typeof CHECKLIST!=='undefined'?CHECKLIST:[]).filter(c=>c.sec===sec);
    if(!items.length) return '';
    const done=items.filter(c=>clItems[c.id]).length;
    const lbl=sec==='before'?(ko?'시프트 전':'Before shift'):sec==='during'?(ko?'시프트 중':'During shift'):(ko?'시프트 종료':'End of shift');
    const bars=items.map(c=>`<div style="flex:1;background:${clItems[c.id]?'var(--ac)':'var(--bg-a)'}"></div>`).join('');
    return `<div style="padding:10px 18px;border-bottom:${sec!=='end'?'1px solid var(--br)':'none'}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px"><div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2)">${lbl}</div><div style="font-size:11px;color:${done===items.length?'var(--ok)':'var(--tx3)'};font-variant-numeric:tabular-nums">${done}/${items.length}</div></div><div style="display:flex;gap:3px;height:6px;background:var(--bg);border-radius:3px;overflow:hidden">${bars}</div></div>`;
  }).join('');
  const clTotal=(typeof CHECKLIST!=='undefined'?CHECKLIST:[]).length;
  const clDone=Object.values(clItems).filter(v=>v===true).length;

  // recent reports
  const repHtml=S.reports.slice(0,3).map(r=>`<div class="rep-row" onclick="goPage('reports')"><div class="rep-date">${new Date(r.created_at).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})}</div><div class="rep-body"><div class="rep-title"><span>${esc(r.submitted_by||'—')}</span>${r.day_label||r.week_label?`<span class="badge" style="background:var(--info-bg);color:var(--info)"><span class="dot" style="background:var(--info)"></span>${esc(r.day_label||r.week_label)}</span>`:''}</div><div class="rep-summary">${esc((r.summary||'').slice(0,160))}</div></div></div>`).join('');

  // ── Needs attention ──
  const _atm=new Date();_atm.setHours(0,0,0,0);
  const _od=(can('tasks_all')?S.tasks:S.tasks.filter(t=>(t.owner||'')===S.profile.name)).filter(t=>t.due_date&&new Date(t.due_date+'T00:00:00')<_atm&&t.status!=='Done');
  const _expCl=can('clients')?S.clients.filter(c=>{if(c.status==='Completed'||!c.end_date)return false;const d=Math.round((new Date(c.end_date+'T00:00:00')-_atm)/86400000);return d<=7;}).sort((a,b)=>new Date(a.end_date)-new Date(b.end_date)):[];
  const _odLbl=t=>{const d=Math.round((_atm-new Date(t.due_date+'T00:00:00'))/86400000);return d===0?(ko?'오늘 마감':'due today'):d===1?(ko?'1일 지남':'1 day overdue'):(ko?d+'일 지남':d+' days overdue');};
  const _exLbl=c=>{const d=Math.round((new Date(c.end_date+'T00:00:00')-_atm)/86400000);return d<0?(ko?Math.abs(d)+'일 전 만료됨':'expired '+Math.abs(d)+'d ago'):d===0?(ko?'오늘 만료':'ends today'):(ko?d+'일 후 만료':'ends in '+d+'d');};
  const _aBlock=(color,icon,title,page,linkTxt,itemsHtml)=>`<div class="attn-block"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:13px;font-weight:600;color:${color}"><span style="margin-right:7px">${icon}</span>${title}</div><span onclick="goPage('${page}')" style="font-size:12px;color:var(--tx2);cursor:pointer" onmouseover="this.style.color='var(--ac-strong)'" onmouseout="this.style.color='var(--tx2)'">${linkTxt} →</span></div>${itemsHtml||''}</div>`;
  let _aBlocks='';
  if(_od.length)_aBlocks+=_aBlock('var(--re)','🔴',_od.length+' '+(ko?'지연 업무':'overdue task'+(_od.length>1?'s':'')),'tasks',ko?'모두 보기':'See all',_od.slice(0,3).map(t=>`<div class="attn-item">• ${esc(ko&&t.title_ko?t.title_ko:t.title)} <span style="color:var(--re)">— ${_odLbl(t)}</span></div>`).join('')+(_od.length>3?`<div class="attn-more">+${_od.length-3} ${ko?'더':'more'}</div>`:''));
  if(_expCl.length)_aBlocks+=_aBlock('var(--ye)','⏰',_expCl.length+' '+(ko?'만료 임박 고객':'client'+(_expCl.length>1?'s':'')+' expiring'),'clients',ko?'고객 보기':'View clients',_expCl.slice(0,3).map(c=>`<div class="attn-item">• ${esc(c.name)} <span style="color:var(--ye)">— ${_exLbl(c)}</span></div>`).join('')+(_expCl.length>3?`<div class="attn-more">+${_expCl.length-3} ${ko?'더':'more'}</div>`:''));
  const attn=_aBlocks
    ? `<div class="panel attn-panel"><div style="font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px">⚠ ${ko?'주의 필요':'Needs attention'}</div>${_aBlocks}</div>`
    : `<div class="panel" style="margin-bottom:28px;padding:14px 20px;display:flex;align-items:center;gap:10px"><span style="font-size:15px;color:var(--gr)">✓</span><span style="font-size:13px;color:var(--tx2)">${ko?'모두 정상 — 지금 처리할 항목이 없습니다.':'All clear — nothing needs attention right now.'}</span></div>`;

  return `<div style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.14em;font-weight:500;margin-bottom:8px">${dateStr}</div>`
    +`<div class="ph" style="margin-bottom:6px">${ko?'안녕하세요':'Welcome back'}, ${esc(S.profile.name.split(' ')[0])}.</div>`
    +`<div class="psub" style="margin-bottom:28px">${online.length} ${online.length===1?'teammate':'teammates'} ${ko?'온라인':'online'} · all systems nominal.</div>`
    +attn
    +`<div class="metric-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px">`
      +metric(ko?'온라인 PC':'PCs online',onlinePc,'/ '+totalPc,uptime+'% uptime','up',onlinePc,'var(--ac)')
      +metric(ko?'팀원':'Team members',teamN,'',online.length+' online','up',teamN,'var(--ac)')
      +metric(ko?'진행 업무':'Open tasks',openT,'',p1+' P1','neutral',null)
      +(can('clients')?metric(ko?'활성 매출':'Active revenue',revFmt,'',activeC+(ko?' 고객':' clients'),'up',activeC,'var(--ac)'):metric(ko?'완료 업무':'Tasks done',S.tasks.filter(t=>t.status==='Done').length,'',ko?'완료됨':'completed','up',S.tasks.filter(t=>t.status==='Done').length,'var(--ac)'))
    +`</div>`
    +shead(ko?'온라인':'Online now',online.length)
    +`<div class="presence-row">${online.length?online.map(m=>`<div class="presence-chip"><div style="position:relative">${av(m.name,m.initials,24,m.avatar_url||null)}<span style="position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;background:var(--ok);border-radius:50%;border:2px solid var(--bg-sb)"></span></div><div><div class="presence-chip-name">${esc(m.name)}</div><div class="presence-chip-role">${ROLE_LABELS[m.role]||m.role}</div></div></div>`).join(''):`<div style="color:var(--tx3);font-size:13px">No one else online right now</div>`}</div>`
    +`<div class="two-col">`
      +`<div>${shead(ko?'우선 업무':'Priority tasks',openTasks.length,'See all','tasks')}<div class="panel" style="padding:0">${openTasks.length?openTasks.map(t=>`<div class="task-row">${pbadge(t.priority)}<div class="task-title">${esc(ko&&t.title_ko?t.title_ko:t.title)}</div><div class="task-owner">${av(t.owner,null,22)}<span>${esc((t.owner||'').split(' ')[0])}</span></div>${sbadge(t.status)}</div>`).join(''):`<div class="nodata">🎉 All tasks done!</div>`}</div></div>`
      +`<div>`
        +shead(ko?'PC 플릿':'PC fleet',null,'Open command','pcs')
        +`<div class="panel"><div style="display:flex;gap:14px;margin-bottom:14px">${fstat(ko?'온라인':'Online',onlinePc,'var(--ok)')}${fstat(ko?'주의':'Warning',warnPc,'var(--warn)')}${fstat(ko?'오프라인':'Offline',offPc,'var(--tx3)')}</div><div style="display:grid;grid-template-columns:repeat(10,1fr);gap:4px">${pcGrid}</div><div class="pc-legend" style="margin-top:14px;margin-bottom:0"><div class="pc-legend-item"><span class="dot" style="background:var(--ok)"></span><span>Online</span></div><div class="pc-legend-item"><span class="dot" style="background:var(--warn)"></span><span>Warning</span></div><div class="pc-legend-item"><span class="dot" style="background:var(--tx4)"></span><span>Offline</span></div></div></div>`
        +(clTotal?`<div style="height:16px"></div>`+shead(ko?'오늘 체크리스트':"Today's checklist",null,clDone+'/'+clTotal+' done','checklist')+`<div class="panel" style="padding:8px 0">${clHtml}</div>`:'')
      +`</div>`
    +`</div>`
    +(S.reports.length?shead(ko?'최근 보고서':'Recent reports',null,'View all','reports')+`<div class="rep-list">${repHtml}</div>`:'');
}


// ── PC COMMAND ────────────────────────────────────────────────────────────
function filterPCs(q){q=(q||'').toLowerCase();document.querySelectorAll('#pc-grid .pc').forEach(el=>{el.style.display=el.textContent.toLowerCase().includes(q)?'':'none';});}
function pgPCs(){
  const ko=S.lang==='ko';
  const f=S.pcFilter||'All';
  const onlineN=S.pcs.filter(p=>p.status==='Online').length;
  const warnN=S.pcs.filter(p=>p.status==='Warning').length;
  const offN=S.pcs.filter(p=>p.status==='Offline').length;
  const total=S.pcs.length;
  const assignedN=S.pcs.filter(p=>p.assigned_to).length;
  const uptime=total?Math.round((onlineN/total)*100*10)/10:0;
  const filtered=S.pcs.filter(p=>f==='All'||p.status===f);
  let selectedPC=S.pcs.find(p=>p.id===S.pcSelected)||S.pcs.find(p=>p.status==='Online')||S.pcs[0];
  const isMgr=can('pcs_edit');

  // metric card (reuse dashboard style)
  const metric=(label,value,unit,delta,dir)=>{
    const arrow=dir==='down'?'↓':dir==='neutral'?'·':'↑';
    const acls=dir==='down'?'arrow down':dir==='neutral'?'arrow neutral':'arrow';
    return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-row"><div class="metric-value">${value}</div>${unit?`<div class="metric-unit">${unit}</div>`:''}</div><div class="metric-delta"><span class="${acls}">${arrow}</span><span>${delta}</span></div></div>`;
  };
  const shead=(title,action,onclick)=>`<div class="section-head"><div class="section-title">${title}</div>${action?`<span style="font-size:12px;color:var(--tx2);cursor:pointer" ${onclick?`onclick="${onclick}"`:''}>${action} →</span>`:''}</div>`;

  // filter pills
  const pills=['All','Online','Warning','Offline'].map(s=>{
    const lbl=ko?{All:'전체',Online:'온라인',Warning:'주의',Offline:'오프라인'}[s]:s;
    const n=s==='All'?'':' · '+S.pcs.filter(p=>p.status===s).length;
    return `<button class="pill ${f===s?'on':''}" onclick="S.pcFilter='${s}';render()">${lbl}${n}</button>`;
  }).join('');

  // PC grid with game color coding (Lineage=Blue, Maple=Orange)
  const pcGameClass=p=>{const g=(p.game||'').toLowerCase();if(g.includes('lineage'))return 'pc-game-lin';if(g.includes('maple'))return 'pc-game-map';return '';};
  const grid=filtered.map(p=>{const gameInfo=p.char_level||p.char_class?'LV.'+esc(p.char_level||'?')+' '+esc(p.char_class||''):p.maple_level||p.maple_class?'🍁 LV.'+esc(p.maple_level||'?')+' '+esc(p.maple_class||''):'';const gc=pcGameClass(p);const cli=(S.clients||[]).find(c=>c.pc_id===p.id);const cliBadge=cli?`<div style="font-size:9px;color:var(--ac);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500" title="Client: ${esc(cli.name)}">👤 ${esc(cli.name)}</div>`:'';return`<div class="pc ${gc} ${selectedPC&&selectedPC.id===p.id?'selected':''}" data-st="${p.status}" onclick="S.pcSelected=${p.id};render()" style="padding:12px 8px;text-align:left"><span class="pc-status-dot"></span><div class="pc-num">PC-${String(p.num).padStart(2,'0')}</div><div class="pc-player">${p.assigned_name?esc(p.assigned_name):'—'}</div>${cliBadge}${gameInfo?`<div style="font-size:9px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${gameInfo.trim()}</div>`:''}</div>`;}).join('');

  // detail panel
  const assignableMembers=S.team.filter(m=>['manager','hr','staff'].includes(m.role)||m.id===S.profile.id);
  let detail='';
  if(selectedPC){
    const sc=selectedPC.status==='Online'?'var(--ok)':selectedPC.status==='Warning'?'var(--warn)':'var(--re)';
    const assignedMember=S.team.find(m=>m.id===selectedPC.assigned_to);
    const boundClient=(S.clients||[]).find(c=>c.pc_id===selectedPC.id);
    const cell=(label,val,color)=>`<div class="pc-detail-cell">${label}<strong style="${color?`color:${color}`:''}">${val}</strong></div>`;
    detail=shead((ko?'상세':'Detail')+' · PC-'+String(selectedPC.num).padStart(2,'0'))
      +`<div class="pc-detail">`
        +cell(ko?'상태':'Status',selectedPC.status,sc)
        +cell(ko?'운영자':'Player',selectedPC.assigned_name||(ko?'미배정':'Unassigned'))
        +cell(ko?'클라이언트':'Client',boundClient?esc(boundClient.name):'<span style="color:var(--tx3);font-weight:400">'+(ko?'팀 Lucky7':'Team Lucky7')+'</span>',boundClient?'var(--ac)':null)
        +cell('ISP',assignedMember?.isp||'—')
        +cell(ko?'도구':'Tool',assignedMember?.tool||'—')
        +cell(ko?'메모':'Note',selectedPC.note?esc(selectedPC.note):'—')
        +cell(ko?'오늘 게임':'Game today',(()=>{if(selectedPC.game)return esc(selectedPC.game);if(selectedPC.char_level||selectedPC.char_class)return('LV.'+esc(selectedPC.char_level||'?')+' '+esc(selectedPC.char_class||'')).trim();if(selectedPC.maple_level||selectedPC.maple_class)return('🍁 LV.'+esc(selectedPC.maple_level||'?')+' '+esc(selectedPC.maple_class||'')).trim();return'—';})())
      +`</div>`;
    if(isMgr){
      detail+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:-12px 0 24px"><span style="font-size:11px;color:var(--tx3);align-self:center;margin-right:2px">${ko?'상태:':'Status:'}</span>${['Online','Warning','Offline'].map(st=>{const active=selectedPC.status===st;const c=st==='Online'?'var(--ok)':st==='Warning'?'var(--warn)':'var(--re)';const lbl=ko?({Online:'온라인',Warning:'주의',Offline:'오프라인'})[st]:st;return '<button class="btn-sm" onclick="setPCStatus('+selectedPC.id+',\''+st+'\')" style="'+(active?'background:'+c+';color:#fff;border-color:'+c:'color:'+c)+'">● '+lbl+'</button>';}).join('')}<select onchange="assignPC(${selectedPC.id},this.value)" style="font-size:12px;padding:5px 10px;border:1px solid var(--br2);border-radius:6px;font-family:inherit;background:var(--bg-c);color:var(--tx)"><option value="">— ${ko?'미배정':'Unassigned'} —</option>${assignableMembers.map(m=>`<option value="${m.id}"${selectedPC.assigned_to===m.id?' selected':''}>${esc(m.name)}</option>`).join('')}</select><button class="btn-sm" onclick="editNote(${selectedPC.id})">✏ ${ko?'메모':'Note'}</button><button class="btn-sm" onclick="editGameToday(${selectedPC.id})">🎮 ${ko?'게임':'Game'}</button><button class="btn-del btn-sm" onclick="removePC(${selectedPC.id},${selectedPC.num})">🗑 ${ko?'삭제':'Remove'}</button></div><div id="ne-${selectedPC.id}" style="display:none;margin:-12px 0 24px"><div style="display:flex;gap:8px"><input id="ni-${selectedPC.id}" value="${esc(selectedPC.note||'')}" placeholder="Note..." style="flex:1;padding:7px 10px;border:1px solid var(--br2);border-radius:6px;font-size:12px;font-family:inherit;background:var(--bg-i);color:var(--tx)"><button class="btn-add btn-sm" onclick="saveNote(${selectedPC.id})">${ko?'저장':'Save'}</button></div></div>`;
    }
  }

  const view=S.pcView||'grid';
  const isMgr2=isMgr;
  const assignTable=`<div class="tw"><table><thead><tr><th>PC</th><th>${ko?'클라이언트':'Client'}</th><th>${ko?'운영자':'Operator'}</th><th>${ko?'상태':'Status'}</th></tr></thead><tbody>${S.pcs.map(p=>{
    const sel=isMgr2?`<select onchange="assignPC(${p.id},this.value)" style="font-size:12px;padding:5px 9px;border:1px solid var(--br2);border-radius:6px;font-family:inherit;background:var(--bg-i);color:var(--tx);min-width:160px"><option value="">— ${ko?'미배정':'Unassigned'} —</option>${assignableMembers.map(m=>`<option value="${m.id}"${p.assigned_to===m.id?' selected':''}>${esc(m.name)}</option>`).join('')}</select>`:(p.assigned_name?esc(p.assigned_name):`<span style="color:var(--tx3)">—</span>`);
    const sc=p.status==='Online'?'var(--ok)':p.status==='Warning'?'var(--warn)':'var(--re)';
    const cli=(S.clients||[]).find(c=>c.pc_id===p.id);
    const cliCell=cli?`<span style="color:var(--ac);font-weight:500">${esc(cli.name)}</span>`:`<span style="color:var(--tx3);font-size:11px">${ko?'팀 Lucky7':'Team Lucky7'}</span>`;
    return `<tr><td><strong style="font-family:var(--font-mono,monospace)">PC-${String(p.num).padStart(2,'0')}</strong></td><td>${cliCell}</td><td>${sel}</td><td><span style="color:${sc}">●</span> ${p.status}</td></tr>`;
  }).join('')}</tbody></table></div>`;
  const toggle=`<div style="display:inline-flex;border:1px solid var(--br);border-radius:8px;overflow:hidden;margin-bottom:16px"><button onclick="S.pcView='grid';render()" style="padding:7px 16px;font-size:12px;font-weight:500;border:none;cursor:pointer;background:${view==='grid'?'var(--tx)':'transparent'};color:${view==='grid'?'var(--bg)':'var(--tx2)'}">${ko?'그리드':'Grid'}</button><span style="width:1px;background:var(--br)"></span><button onclick="S.pcView='assign';render()" style="padding:7px 16px;font-size:12px;font-weight:500;border:none;cursor:pointer;background:${view==='assign'?'var(--tx)':'transparent'};color:${view==='assign'?'var(--bg)':'var(--tx2)'}">${ko?'배정 (전체)':'Assign all'}</button></div>`;

  return `<div style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.14em;font-weight:500;margin-bottom:8px">${ko?'운영':'Operations'}</div>`
    +`<div class="ph" style="margin-bottom:6px">${ko?'PC 현황':'PC Status'}</div>`
    +`<div class="psub" style="margin-bottom:16px">${ko?`${total}대 워크스테이션 실시간 상태. 클릭하여 확인.`:`Live status across ${total} workstations. Click any PC to inspect.`}</div>`
    +toggle
    +`<div class="metric-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">`
      +metric(ko?'온라인':'Online',onlineN,'',uptime+'% avg uptime','up')
      +metric(ko?'주의':'Warning',warnN,'',ko?'주의 필요':'needs attention','neutral')
      +metric(ko?'오프라인':'Offline',offN,'',ko?'미할당':'unallocated','neutral')
      +metric(ko?'배정됨':'Players assigned',assignedN,'/ '+total,(total-assignedN)+(ko?' 빈 슬롯':' open slots'),'neutral')
    +`</div>`
    +`<div style="display:flex;align-items:center;gap:16px;margin-bottom:12px"><div class="pc-legend"><div class="pc-legend-item"><span class="dot" style="background:var(--ok)"></span><span>Online</span></div><div class="pc-legend-item"><span class="dot" style="background:var(--warn)"></span><span>Warning</span></div><div class="pc-legend-item"><span class="dot" style="background:var(--tx4)"></span><span>Offline</span></div></div><div style="width:1px;height:16px;background:var(--br)"></div><div class="pc-legend"><div class="pc-legend-item"><span class="dot" style="background:#6495ED;box-shadow:0 0 4px #6495ED66"></span><span>Lineage</span></div><div class="pc-legend-item"><span class="dot" style="background:#FFA500;box-shadow:0 0 4px #FFA50066"></span><span>Maple</span></div></div></div>`
    +(view==='assign'

function pgTasks(){
  const ko=S.lang==='ko';
  const f=S.taskFilter||'All';
  const seeAll=can('tasks_all');
  const mine=t=>{const o=(t.owner||'').toLowerCase().trim();const n=(S.profile.name||'').toLowerCase().trim();const fn=n.split(' ')[0];return o===n||o===fn||(fn&&o.includes(fn));};
  const scope=seeAll?S.tasks:S.tasks.filter(mine);
  const filtered=scope.filter(t=>{if(f==='All')return true;if(f==='Open')return t.status!=='Done';if(f==='Done')return t.status==='Done';if(f==='Overdue')return t.due_date&&new Date(t.due_date+'T00:00:00')<(()=>{const d=new Date();d.setHours(0,0,0,0);return d;})()&&t.status!=='Done';return t.priority===f;});
  const openN=scope.filter(t=>t.status!=='Done').length;
  const p1N=scope.filter(t=>t.priority==='P1'&&t.status!=='Done').length;
  const addForm=can('tasks_edit')&&S.showAddTask?`<div class="fbox"><div class="fbox-t">${S.lang==='ko'?'새 업무 추가':'Add task'}</div><div class="fgrid"><div class="fg2"><label>Task (EN)</label><input id="nt-t" placeholder="Task..."></div><div class="fg2"><label>업무 (KO)</label><input id="nt-k" placeholder="업무..."></div><div class="fg2"><label>Owner</label><select id="nt-o">${S.team.map(m=>`<option>${esc(m.name)}</option>`).join('')}</select></div><div class="fg2"><label>Priority</label><select id="nt-p"><option>P1</option><option>P2</option><option>P3</option></select></div><div class="fg2"><label>Category</label><input id="nt-c" placeholder="Tech..."></div><div class="fg2"><label>${S.lang==='ko'?'마감일':'Due date'}</label><input type="date" id="nt-due" style="width:100%;padding:8px 10px;border:1px solid var(--br2);border-radius:8px;font-size:12px;font-family:inherit;background:var(--bg-i);color:var(--tx);color-scheme:dark"></div></div><div style="display:flex;gap:8px"><button class="btn-add" onclick="addTask()">${S.lang==='ko'?'저장':'Save'}</button><button onclick="S.showAddTask=false;render()">${S.lang==='ko'?'취소':'Cancel'}</button></div></div>`:'';
  const pbadge=p=>{const bg=p==='P1'?'var(--err-bg)':p==='P2'?'var(--warn-bg)':'var(--bg-a)';const c=p==='P1'?'var(--re)':p==='P2'?'var(--ye)':'var(--tx2)';return `<span class="pbadge" style="background:${bg};color:${c}">${p}</span>`;};
  const sbadge=s=>{const m={Done:['var(--gr-bg)','var(--gr)'],'In Progress':['var(--info-bg,rgba(111,147,196,.12))','var(--info,#6f93c4)'],Todo:['var(--bg-a)','var(--tx2)']};const[bg,c]=m[s]||m.Todo;return `<span class="badge" style="background:${bg};color:${c}"><span class="dot" style="background:${c}"></span>${s}</span>`;};
  const _tm=new Date();_tm.setHours(0,0,0,0);
  const isOverdue=t=>t.due_date&&new Date(t.due_date+'T00:00:00')<_tm&&t.status!=='Done';
  const dueLabel=t=>{if(!t.due_date)return '';const due=new Date(t.due_date+'T00:00:00');const diff=Math.round((due-_tm)/86400000);const od=diff<0&&t.status!=='Done';let txt;if(diff===0)txt=ko?'오늘':'today';else if(diff===1)txt=ko?'내일':'tomorrow';else if(diff===-1)txt=ko?'어제':'yesterday';else if(diff<0)txt=Math.abs(diff)+(ko?'일 지남':'d ago');else txt=(ko?diff+'일 후':'in '+diff+'d');return '<span style="font-size:11px;white-space:nowrap;color:'+(od?'var(--re)':'var(--tx3)')+';font-weight:'+(od?'600':'400')+'">'+(od?'⚠ ':'')+(ko?'마감 ':'due ')+txt+'</span>';};
  const pills=['All','Open','Overdue','P1','P2','P3','Done'].map(x=>`<button class="pill ${f===x?'on':''}" onclick="S.taskFilter='${x}';render()">${x}</button>`).join('');
  const rows=filtered.length?filtered.map(t=>{
    const done=t.status==='Done';const ip=t.status==='In Progress';
    const ck=can('tasks_done')?`onclick="toggleTask(${t.id})"`:'';
    return `<div class="task-row" style="${isOverdue(t)?'box-shadow:inset 3px 0 0 var(--re)':''}"><div class="task-check ${done?'on':ip?'ip':''}" ${ck} style="cursor:${can('tasks_done')?'pointer':'default'}"></div>${pbadge(t.priority)}<div class="task-title ${done?'done':''}">${esc(ko&&t.title_ko?t.title_ko:t.title)}</div>${t.category?`<div class="task-meta">${esc(t.category)}</div>`:''}${dueLabel(t)}<div class="task-owner">${av(t.owner,null,22)}<span>${esc(t.owner||'—')}</span></div>${sbadge(t.status)}${can('tasks_edit')?`<button class="btn-del btn-sm" onclick="delTask(${t.id})" style="margin-left:4px">🗑</button>`:''}</div>`;
  }).join(''):`<div class="empty">${ko?'해당 업무 없음':'No tasks match this filter'}</div>`;
  return `<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px"><div><div style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.14em;font-weight:500;margin-bottom:8px">${ko?'운영':'Operations'}</div><div class="ph" style="margin-bottom:6px">${ko?'업무':'Tasks'}</div><div class="psub" style="margin:0">${openN} ${ko?'진행 업무':'open tasks'} · ${p1N} P1${scope.filter(isOverdue).length?` · <span style="color:var(--re)">${scope.filter(isOverdue).length} ${ko?'지연':'overdue'}</span>`:''}${seeAll?'':' · '+(ko?'내 업무':'my tasks')}</div></div>${can('tasks_edit')?`<button class="btn-add" onclick="S.showAddTask=!S.showAddTask;render()">+ ${ko?'새 업무':'New task'}</button>`:''}</div>`
    +`<div class="toolbar"><div class="pill-row" style="margin-bottom:0">${pills}</div><input class="input" placeholder="${ko?'업무 검색…':'Search tasks…'}" oninput="filterTasks(this.value)"></div>`
    +addForm
    +`<div class="panel" style="padding:0" id="task-list">${rows}</div>`;
}

function pgRecruitment(){
  const ko=S.lang==='ko';
  function cpuPass(cpu){if(!cpu)return null;const c=cpu.toLowerCase();const ig=S.recruitReqs?.min_intel_gen||8;const rg=S.recruitReqs?.min_ryzen_gen||3;const im=c.match(/i[3579][\s\-]?(\d{4,5})/);if(im){return parseInt(im[1].toString().slice(0,-3))>=ig;}const rm=c.match(/ryzen\s*[357]\s*(\d{4})/);if(rm){return parseInt(rm[1].toString()[0])>=rg;}return null;}
  function ramPass(r){if(!r)return null;const n=parseInt(r);const min=S.recruitReqs?.min_ram||8;return isNaN(n)?null:n>=min;}
  function spdPass(s){if(!s)return null;const n=parseInt(s);const min=S.recruitReqs?.min_speed||70;return isNaN(n)?null:n>=min;}
  function gpuPass(gpu){
    if(!gpu)return null;
    const g=gpu.toLowerCase().replace(/\s+/g,' ');
    // RTX any series → always pass
    if(/rtx\s*\d{4}/.test(g)) return true;
    // GTX 16xx series → pass
    if(/gtx\s*16\d{2}/.test(g)) return true;
    // GTX 10xx → only 1050 Ti or 1060+
    const m10=g.match(/gtx\s*10(\d{2})\s*(ti)?/);
    if(m10){
      const num=parseInt(m10[1]);
      const ti=!!m10[2];
      if(num>=60) return true;
      if(num===50&&ti) return true;
      return false;
    }
    // GTX 9xx and below → fail
    if(/gtx\s*[1-9]\d{0,2}\b/.test(g)||/gt\s*\d/.test(g)) return false;
    // AMD RX 7xxx → all pass
    if(/rx\s*7\d{3}/.test(g)) return true;
    // RX 6xxx → 6500+ passes
    const m6=g.match(/rx\s*6(\d{3})/);
    if(m6) return parseInt(m6[1])>=500;
    // RX 5xxx → 5500+ passes
    const m5=g.match(/rx\s*5(\d{3})/);
    if(m5) return parseInt(m5[1])>=500;
    // RX 5xx → 560+ passes (covers 560, 570, 580, 590)
    const mrx5=g.match(/rx\s*5(\d{2})\b/);
    if(mrx5) return parseInt(mrx5[1])>=60;
    // RX 4xx → fail (below 1050 Ti perf)
    if(/rx\s*4\d{2}/.test(g)) return false;
    // Vega 56 / Vega 64 → pass
    if(/vega\s*(56|64)/.test(g)) return true;
    return null;
  }

  function getStatus(r){if(!r.cpu&&!r.gpu&&!r.ram&&!r.speed&&!r.ssd)return'pending';const reqIp=S.recruitReqs?.require_static_ip!==false;const reqLan=S.recruitReqs?.require_lan_cable!==false;const reqSsd=S.recruitReqs?.require_ssd!==false;const checks=[cpuPass(r.cpu),gpuPass(r.gpu),ramPass(r.ram),spdPass(r.speed),reqSsd?ssdPass(r.ssd):null,reqIp?(r.static_ip===true?true:r.static_ip===false?false:null):null,reqLan?(r.lan_cable===true?true:r.lan_cable===false?false:null):null];const def=checks.filter(c=>c!==null);if(def.some(c=>c===false))return'fail';if(def.length>0&&def.every(c=>c===true))return'pass';return'pending';}
