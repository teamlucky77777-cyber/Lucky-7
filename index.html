<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🍀 Lucky 7</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--bg-sb:#f7f6f3;--bg-hover:#efefee;--bg-active:#e9e9e7;--bg-card:#fff;--bg-input:#fff;--text:#37352f;--text2:#787774;--text3:#acaba8;--border:#e9e9e7;--border2:#d3d1cb;--acc:#2383e2;--acc-bg:#e8f3ff;--gr:#0f7b6c;--gr-bg:#edf3ec;--re:#e03e3e;--re-bg:#fbe4e4;--ye:#cb912f;--ye-bg:#fdf3d0;--pu:#6940a5;--pu-bg:#f4f0fb;--r:4px;--r2:8px}
[data-theme=dark]{--bg:#191919;--bg-sb:#1f1f1f;--bg-hover:#2f2f2f;--bg-active:#373737;--bg-card:#252525;--bg-input:#252525;--text:#cfcfce;--text2:#9b9a97;--text3:#555553;--border:#2f2f2f;--border2:#404040;--acc:#529cca;--acc-bg:#1c3149;--gr:#4dab9a;--gr-bg:#1b3134;--re:#e16060;--re-bg:#3a1616;--ye:#dfab01;--ye-bg:#3b2f00;--pu:#9a6dd7;--pu-bg:#2d1f45}
body{font-family:'Inter',-apple-system,sans-serif;font-size:14px;background:var(--bg);color:var(--text);min-height:100vh}
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.auth-box{background:var(--bg-card);border-radius:var(--r2);padding:40px;width:400px;border:1px solid var(--border)}
.auth-logo{text-align:center;font-size:40px;margin-bottom:8px}
.auth-title{text-align:center;font-size:20px;font-weight:700;margin-bottom:4px}
.auth-sub{text-align:center;font-size:13px;color:var(--text2);margin-bottom:24px}
.auth-tabs{display:flex;margin-bottom:20px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.auth-tab{flex:1;padding:8px;font-size:13px;font-weight:500;border:none;background:transparent;cursor:pointer;color:var(--text2);font-family:inherit}
.auth-tab.on{background:var(--text);color:var(--bg)}
.auth-err{background:var(--re-bg);color:var(--re);border-radius:var(--r);padding:8px 12px;font-size:13px;margin-bottom:12px}
.auth-ok{background:var(--gr-bg);color:var(--gr);border-radius:var(--r);padding:8px 12px;font-size:13px;margin-bottom:12px}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.role-opt{padding:10px;border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;text-align:center;font-size:13px;background:var(--bg);color:var(--text2)}
.role-opt.on{border-color:var(--text);background:var(--text);color:var(--bg);font-weight:500}
.ro-icon{font-size:20px;display:block;margin-bottom:4px}
.invite-field{display:none}.invite-field.show{display:block}
#app-screen{display:none}
#app{display:flex;min-height:100vh}
#sb{width:240px;background:var(--bg-sb);display:flex;flex-direction:column;min-height:100vh;border-right:1px solid var(--border);flex-shrink:0}
.sb-top{padding:10px 12px;display:flex;align-items:center;gap:8px;border-radius:var(--r);margin:6px 6px 0;cursor:default}
.sb-ws-name{font-size:14px;font-weight:700;color:var(--text)}
.sb-user-line{padding:2px 14px 6px;font-size:12px;color:var(--text3)}
.sb-badge{padding:0 14px 8px;display:block}
.sb-badge span{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.sb-ceo{background:var(--ye-bg)!important;color:var(--ye)!important}
.sb-manager{background:var(--gr-bg)!important;color:var(--gr)!important}
.sb-settlement{background:var(--acc-bg)!important;color:var(--acc)!important}
.sb-hr{background:var(--pu-bg)!important;color:var(--pu)!important}
.sb-staff{background:var(--bg-active)!important;color:var(--text2)!important}
.sb-player{background:var(--re-bg)!important;color:var(--re)!important}
.sb-divider{height:1px;background:var(--border);margin:4px 12px}
.sb-section-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:10px 14px 3px}
.sb-nav{flex:1;padding:0 6px 8px}
.ni{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:var(--r);cursor:pointer;color:var(--text2);font-size:13px;margin:1px 0;user-select:none}
.ni:hover{background:var(--bg-hover);color:var(--text)}
.ni.on{background:var(--bg-active);color:var(--text);font-weight:500}
.ni-e{width:20px;text-align:center;font-size:14px;flex-shrink:0}
.sb-bot{padding:8px;border-top:1px solid var(--border)}
.lang-row{display:flex;gap:4px;margin-bottom:4px}
.lbtn{flex:1;padding:5px;font-size:11px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit}
.lbtn.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.theme-btn,.signout{width:100%;padding:6px 10px;font-size:12px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;border-radius:var(--r);text-align:left;display:flex;align-items:center;gap:6px;margin-top:2px}
.theme-btn:hover,.signout:hover{background:var(--bg-hover);color:var(--text)}
.signout:hover{color:var(--re)}
#main{flex:1;overflow:auto;background:var(--bg)}
.page-content{max-width:900px;margin:0 auto;padding:40px 60px}
.ph{font-size:30px;font-weight:700;margin-bottom:4px;line-height:1.2}
.psub{font-size:13px;color:var(--text3);margin-bottom:28px}
.sh{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:8px}
.shr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
.met{background:var(--bg-card);border-radius:var(--r2);padding:14px 16px;border:1px solid var(--border)}
.mv{font-size:28px;font-weight:700;line-height:1.1}
.ml{font-size:12px;color:var(--text2);margin-top:3px}
.cg{color:var(--gr)}.cb{color:var(--acc)}.ca{color:var(--ye)}.cr{color:var(--re)}
.bdg{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:var(--r)}
.bs{background:var(--gr-bg);color:var(--gr)}.bi{background:var(--acc-bg);color:var(--acc)}.bw{background:var(--ye-bg);color:var(--ye)}.bx{background:var(--bg-active);color:var(--text2)}.bd{background:var(--re-bg);color:var(--re)}
.pb{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:var(--r)}
.pbp1{background:var(--re-bg);color:var(--re)}.pbp2{background:var(--ye-bg);color:var(--ye)}.pbp3{background:var(--acc-bg);color:var(--acc)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:24px}
.tcard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r2);padding:14px}
.tc-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tc-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)}
.tc-row:last-child{border:none}
.tw{background:var(--bg-card);border-radius:var(--r2);border:1px solid var(--border);overflow:hidden;margin-bottom:20px}
table{width:100%;border-collapse:collapse}
thead{background:var(--bg-sb)}
th{padding:8px 12px;font-size:12px;color:var(--text2);font-weight:500;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 12px;font-size:13px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg-hover)}
.erow>td{padding:0!important;border-bottom:1px solid var(--border)!important}
.erow-in{background:var(--acc-bg);padding:14px 16px;border-left:3px solid var(--acc)}
button{font-family:'Inter',sans-serif;font-size:13px;padding:6px 12px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer}
button:hover{background:var(--bg-hover)}
.btn-add{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-add:hover{opacity:.85}
.btn-del{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;font-size:13px}
.btn-del:hover{color:var(--re)}
.btn-sm{font-size:12px;padding:3px 8px;border-radius:var(--r)}
.btn-edit{font-size:11px;padding:4px 9px;border-radius:var(--r)}
.btn-edit.on{background:var(--acc-bg);color:var(--acc);border-color:var(--acc)}
.fbox{background:var(--acc-bg);border:1px solid var(--acc);border-radius:var(--r2);padding:16px;margin-bottom:16px;border-left:3px solid var(--acc)}
.fbox-t{font-weight:600;font-size:13px;color:var(--acc);margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px;margin-bottom:12px}
.fg label,.fg2 label{display:block;font-size:11px;color:var(--text2);margin-bottom:3px;font-weight:500}
.fg input,.fg select,.fg2 input,.fg2 select,.fg2 textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:inherit;color:var(--text);outline:none;background:var(--bg-input)}
.fg input:focus,.fg select:focus,.fg2 input:focus,.fg2 select:focus,.fg2 textarea:focus{border-color:var(--acc)}
.fg2 textarea{resize:vertical}
.pcgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.pcc{border-radius:var(--r);padding:10px 4px;text-align:center}
.pcc.clickable{cursor:pointer}.pcc.clickable:hover{opacity:.8}
.pcc-on{background:var(--gr-bg);border:1px solid #c4dfcc}.pcc-on .pcc-n,.pcc-on .pcc-s{color:var(--gr)}
.pcc-warn{background:var(--ye-bg);border:1px solid #e8d5a0}.pcc-warn .pcc-n,.pcc-warn .pcc-s{color:var(--ye)}
.pcc-off{background:var(--re-bg);border:1px solid #f0c4c4}.pcc-off .pcc-n,.pcc-off .pcc-s{color:var(--re)}
.pcc-n{font-size:12px;font-weight:600}.pcc-s{font-size:10px;opacity:.8;margin-top:1px}
.tlist{background:var(--bg-card);border-radius:var(--r2);border:1px solid var(--border);overflow:hidden;margin-bottom:16px}
.trow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border)}
.trow:last-child{border:none}.trow:hover{background:var(--bg-hover)}.trow.done{opacity:.5}
.tcheck{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--border2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px}
.tcheck:hover{border-color:var(--acc)}.tcheck.on{background:var(--gr);border-color:var(--gr);color:#fff}.tcheck.ip{background:var(--ye-bg);border-color:var(--ye);color:var(--ye)}
.ttxt{flex:1;font-size:13px}.ttxt.s{text-decoration:line-through;color:var(--text3)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg);cursor:pointer;color:var(--text2)}
.pill.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pc-col{background:var(--bg-sb);border-radius:var(--r2);padding:12px;border:1px solid var(--border)}
.pc-col-h{font-size:12px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.pc-cnt{font-size:11px;background:var(--bg-active);border-radius:20px;padding:2px 7px;color:var(--text2)}
.pc-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:9px 10px;margin-bottom:6px}
.pc-name{font-weight:600;font-size:13px;margin-bottom:2px}.pc-meta{font-size:11px;color:var(--text3);margin-bottom:6px}
.rlayout{display:grid;grid-template-columns:200px 1fr;gap:16px}
.ritem{padding:8px 10px;border-radius:var(--r);cursor:pointer;margin-bottom:2px}
.ritem:hover{background:var(--bg-hover)}.ritem.on{background:var(--bg-active)}
.rview{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r2);padding:24px}
.rsnap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.rsc{background:var(--bg-sb);border-radius:var(--r);padding:12px;text-align:center;border:1px solid var(--border)}
.rsv{font-size:22px;font-weight:700}.rsl{font-size:11px;color:var(--text2)}
.rsec{margin-bottom:16px}
.rsec-t{font-size:11px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.rsec-b{font-size:13px;color:var(--text);line-height:1.7;white-space:pre-wrap}
.rempty{display:flex;align-items:center;justify-content:center;height:180px;font-size:13px;color:var(--text3);border:1px dashed var(--border);border-radius:var(--r2)}
.code-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r2);padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.code-role{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;text-transform:uppercase;width:100px;text-align:center}
.code-val{flex:1;font-family:monospace;font-size:13px;font-weight:600;color:var(--text);background:var(--bg-sb);padding:6px 10px;border-radius:var(--r);border:1px solid var(--border)}
.code-used{text-decoration:line-through;color:var(--text3)}.code-status{font-size:12px;color:var(--text3)}
.player-wrap{max-width:560px;margin:0 auto}
.player-hero{background:linear-gradient(135deg,#1a2332,#0f7b6c);border-radius:12px;padding:28px 24px;color:#fff;margin-bottom:20px;text-align:center}
.player-char{font-size:26px;font-weight:700;margin-bottom:4px}.player-server{font-size:13px;opacity:.8;margin-bottom:16px}
.player-status-big{display:inline-block;font-size:13px;font-weight:600;padding:5px 16px;border-radius:20px;background:rgba(255,255,255,.2)}
.player-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r2);padding:18px;margin-bottom:12px}
.player-card-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:12px}
.player-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.player-row:last-child{border:none}.player-key{color:var(--text2)}.player-val{font-weight:600}
.player-note{background:var(--gr-bg);border:1px solid #c4dfcc;border-radius:var(--r);padding:12px;font-size:13px;color:var(--gr);line-height:1.6}
.player-none{text-align:center;padding:60px 20px;color:var(--text3)}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.nodata{padding:20px;text-align:center;font-size:13px;color:var(--text3)}
.tip{font-size:12px;color:var(--text3);margin-bottom:16px}
.info-tag{font-size:12px;background:var(--acc-bg);color:var(--acc);padding:4px 10px;border-radius:20px;display:inline-block;margin-bottom:12px}
.setup-box{background:var(--ye-bg);border:1px solid var(--border2);border-radius:var(--r2);padding:20px}
.setup-box h3{color:var(--ye);margin-bottom:8px}.setup-box code{background:var(--bg);border:1px solid var(--border);padding:2px 6px;border-radius:var(--r);font-size:12px;display:block;margin:4px 0;word-break:break-all}
</style>
</head>
<body>

<!-- ═══ AUTH SCREEN ═══ -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">🍀</div>
    <div class="auth-title">Lucky 7</div>
    <div class="auth-sub" id="auth-sub">Sign in to your account</div>
    <div class="auth-tabs">
      <button class="auth-tab on" onclick="showTab('in')">Sign In</button>
      <button class="auth-tab" onclick="showTab('up')">Create Account</button>
    </div>
    <div id="auth-msg" style="display:none"></div>

    <!-- SIGN IN -->
    <div id="tab-in">
      <div class="fg"><label>Email</label><input type="email" id="si-email" placeholder="your@email.com" onkeydown="if(event.key==='Enter')signIn()"></div>
      <div class="fg"><label>Password</label><input type="password" id="si-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')signIn()"></div>
      <button class="btn-add btn-full" id="si-btn" onclick="signIn()">Sign In</button>
    </div>

    <!-- SIGN UP -->
    <div id="tab-up" style="display:none">
      <div class="fg"><label>Full name</label><input id="su-name" placeholder="Your name"></div>
      <div class="fg"><label>Email</label><input type="email" id="su-email" placeholder="your@email.com"></div>
      <div class="fg"><label>Password</label><input type="password" id="su-pass" placeholder="Min 6 characters"></div>
      <div class="fg">
        <label>I am a...</label>
        <div class="role-pick">
          <div class="role-opt on" onclick="pickRole('player')" id="ropt-player">
            <span class="ro-icon">🎮</span>Player
          </div>
          <div class="role-opt" onclick="pickRole('staff')" id="ropt-staff">
            <span class="ro-icon">🖥</span>Staff / Team
          </div>
        </div>
      </div>
      <div class="invite-field fg" id="invite-field">
        <label>Invite code <span style="color:#aaa;font-weight:400">(given by your manager)</span></label>
        <input id="su-code" placeholder="e.g. MGR-LUCKY7-BALEN" style="font-family:monospace;letter-spacing:.5px">
      </div>
      <button class="btn-add btn-full" id="su-btn" onclick="signUp()">Create Account</button>
    </div>
  </div>
</div>

<!-- ═══ APP SCREEN ═══ -->
<div id="app-screen">
  <div id="app">
    <nav id="sb">
      <div class="sb-top">
        <div class="sb-brand">🍀 Lucky 7</div>
        <div class="sb-user" id="sb-name">...</div>
        <div id="sb-badge"></div>
      </div>
      <div class="sb-nav" id="nav-links"></div>
      <div class="sb-bot">
        <div style="display:flex;gap:4px;margin-bottom:8px">
          <button class="lbtn on" id="btn-en" onclick="setLang('en')">EN</button>
          <button class="lbtn" id="btn-ko" onclick="setLang('ko')">한국어</button>
        </div>
        <button class="signout" onclick="signOut()">← Sign out</button>
      </div>
    </nav>
    <main id="main"><div style="padding:40px;text-align:center;color:#aaa">Loading...</div></main>
  </div>
</div>

// ── AUTH ──────────────────────────────────────────────────────────────────
let signupRole = 'player';

function showTab(tab){
  document.getElementById('tab-in').style.display=tab==='in'?'block':'none';
  document.getElementById('tab-up').style.display=tab==='up'?'block':'none';
  document.querySelectorAll('.auth-tab').forEach((b,i)=>b.classList.toggle('on',['in','up'][i]===tab));
  document.getElementById('auth-msg').style.display='none';
  document.getElementById('auth-sub').textContent=tab==='in'?'Sign in to your account':'Create your account';
}

function pickRole(r){
  signupRole=r;
  document.querySelectorAll('.role-opt').forEach(el=>el.classList.remove('on'));
  document.getElementById(`ropt-${r}`).classList.add('on');
  const inv=document.getElementById('invite-field');
  inv.classList.toggle('show',r!=='player');
}

function showMsg(msg,type='err'){
  const el=document.getElementById('auth-msg');
  el.className=type==='ok'?'auth-ok':'auth-err';
  el.textContent=msg;el.style.display='block';
}

async function signIn(){
  const email=document.getElementById('si-email').value.trim();
  const pass=document.getElementById('si-pass').value;
  if(!email||!pass){showMsg('Please enter email and password.');return;}
  const btn=document.getElementById('si-btn');
  btn.textContent='Signing in...';btn.disabled=true;
  try{
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('Connection timeout. Check your internet and try again.')),10000));
    const login=sb.auth.signInWithPassword({email,password:pass});
    const {error}=await Promise.race([login,timeout]);
    if(error){showMsg(error.message);btn.textContent='Sign In';btn.disabled=false;}
  }catch(e){showMsg(e.message);btn.textContent='Sign In';btn.disabled=false;}
}

async function signUp(){
  const name=document.getElementById('su-name').value.trim();
  const email=document.getElementById('su-email').value.trim();
  const pass=document.getElementById('su-pass').value;
  const code=document.getElementById('su-code').value.trim();
  if(!name||!email||!pass){showMsg('Please fill in all fields.');return;}
  if(pass.length<6){showMsg('Password must be at least 6 characters.');return;}
  if(signupRole!=='player'&&!code){showMsg('Please enter your invite code.');return;}
  document.getElementById('su-btn').textContent='Creating account...';
  document.getElementById('su-btn').disabled=true;
  const {error}=await sb.auth.signUp({email,password:pass,options:{data:{name}}});
  if(error){showMsg(error.message);document.getElementById('su-btn').textContent='Create Account';document.getElementById('su-btn').disabled=false;return;}
  if(signupRole!=='player'&&code){
    await new Promise(r=>setTimeout(r,1500));
    const {data:result}=await sb.rpc('redeem_invite_code',{p_code:code});
    if(result==='invalid'){showMsg('Account created but invite code was invalid. Your role is set to Player for now — contact your manager.',null);return;}
  }
  showMsg('Account created! Check your email to confirm, then sign in.','ok');
  document.getElementById('su-btn').textContent='Create Account';
  document.getElementById('su-btn').disabled=false;
}

async function signOut(){await sb.auth.signOut();location.reload();}

// ── APP INIT ──────────────────────────────────────────────────────────────
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) await onLogin(session.user);
  else showAuth();
  sb.auth.onAuthStateChange(async(_,sess)=>{if(sess)await onLogin(sess.user);else showAuth();});
}

function showAuth(){document.getElementById('auth-screen').style.display='flex';document.getElementById('app-screen').style.display='none';}

async function onLogin(user){
  try{
  S.user=user;
  const {data:p,error:pe}=await sb.from('user_profiles').select('*').eq('id',user.id).single();
  if(pe)console.warn('Profile fetch error:',pe.message);
  S.profile=p||{name:user.email,initials:'??',role:'player'};
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  document.getElementById('sb-name').textContent=S.profile.name;
  document.getElementById('sb-badge').innerHTML=`<span class="sb-badge sb-${S.profile.role}">${ROLE_ICONS[S.profile.role]||''} ${ROLE_LABELS[S.profile.role]||S.profile.role}</span>`;
  S.page = S.profile.role==='player' ? 'player' : 'dashboard';
  await loadAll();
  render();initTheme();
  }catch(e){console.error('Login error:',e);showAuth();alert('Login error: '+e.message);}
}

async function loadAll(){
  const role=S.profile?.role||'player';
  if(role==='player'){
    const {data}=await sb.from('clients').select('*').eq('player_email',S.user.email);
    S.playerOrder=data?.[0]||null; return;
  }
  const loads=[sb.from('user_profiles').select('*'),sb.from('tasks').select('*').order('created_at'),sb.from('korea_pcs').select('*').order('num')];
  if(can('clients')) loads.push(sb.from('clients').select('*').order('created_at')); else loads.push(Promise.resolve({data:[]}));
  if(can('recruitment')) loads.push(sb.from('recruits').select('*').order('created_at')); else loads.push(Promise.resolve({data:[]}));
  if(can('reports')) loads.push(sb.from('reports').select('*').order('created_at',{ascending:false})); else if(can('reports_submit')) loads.push(sb.from('reports').select('*').eq('created_by',S.user.id).order('created_at',{ascending:false})); else loads.push(Promise.resolve({data:[]}));
  if(can('invite')) loads.push(sb.from('invite_codes').select('*').order('created_at')); else loads.push(Promise.resolve({data:[]}));
  const [t,tk,pc,cl,rec,rep,codes]=await Promise.all(loads);
  S.team=t.data||[];S.tasks=tk.data||[];S.pcs=pc.data||[];
  S.clients=cl.data||[];S.recruits=rec.data||[];S.reports=rep.data||[];S.codes=codes.data||[];
}

// ── ACTIONS ───────────────────────────────────────────────────────────────
async function cyclePC(id){const ord=['Online','Warning','Offline'];const p=S.pcs.find(x=>x.id===id);const ns=ord[(ord.indexOf(p.status)+1)%3];await sb.from('korea_pcs').update({status:ns}).eq('id',id);S.pcs=S.pcs.map(x=>x.id===id?{...x,status:ns}:x);render();}
function editNote(id){document.getElementById(`ne-${id}`).style.display='';}
async function saveNote(id){const v=document.getElementById(`ni-${id}`).value;await sb.from('korea_pcs').update({note:v}).eq('id',id);S.pcs=S.pcs.map(p=>p.id===id?{...p,note:v}:p);render();}
async function toggleTask(id){const x=S.tasks.find(t=>t.id===id);const ord=['Todo','In Progress','Done'];const ns=ord[(ord.indexOf(x.status)+1)%3];await sb.from('tasks').update({status:ns}).eq('id',id);S.tasks=S.tasks.map(t=>t.id===id?{...t,status:ns}:t);render();}
async function delTask(id){if(!confirm('Delete?'))return;await sb.from('tasks').delete().eq('id',id);S.tasks=S.tasks.filter(t=>t.id!==id);render();}
async function addTask(){const ti=document.getElementById('nt-t').value.trim();if(!ti)return;const {data}=await sb.from('tasks').insert({title:ti,title_ko:document.getElementById('nt-k').value,owner:document.getElementById('nt-o').value,priority:document.getElementById('nt-p').value,status:'Todo',category:document.getElementById('nt-c').value}).select().single();if(data)S.tasks.push(data);S.showAddTask=false;render();}
async function toggleClient(id){const ord=['Active','Paused','Completed'];const c=S.clients.find(x=>x.id===id);const ns=ord[(ord.indexOf(c.status)+1)%3];await sb.from('clients').update({status:ns}).eq('id',id);S.clients=S.clients.map(x=>x.id===id?{...x,status:ns}:x);render();}
async function delClient(id){if(!confirm('Delete?'))return;await sb.from('clients').delete().eq('id',id);S.clients=S.clients.filter(c=>c.id!==id);render();}
async function addClient(){const n=document.getElementById('nc-n').value.trim();if(!n)return;const {data}=await sb.from('clients').insert({name:n,char_info:document.getElementById('nc-ch').value,server:document.getElementById('nc-sv').value,service:document.getElementById('nc-sc').value,status:'Active',start_date:document.getElementById('nc-st').value,end_date:document.getElementById('nc-en').value,price:document.getElementById('nc-pr').value,player_email:document.getElementById('nc-em').value}).select().single();if(data)S.clients.push(data);S.showAddClient=false;render();}
function toggleEdit(id){S.editMember=S.editMember===id?null:id;render();}
function cancelEdit(){S.editMember=null;render();}
async function saveMember(id){const upd={name:document.getElementById('e-name').value,initials:document.getElementById('e-ini').value,isp:document.getElementById('e-isp').value,tool:document.getElementById('e-tool').value,since:document.getElementById('e-since').value};await sb.from('user_profiles').update(upd).eq('id',id);S.team=S.team.map(m=>m.id===id?{...m,...upd}:m);S.editMember=null;render();}
async function moveRecruit(id,stage){await sb.from('recruits').update({stage}).eq('id',id);S.recruits=S.recruits.map(r=>r.id===id?{...r,stage}:r);render();}
async function delRecruit(id){if(!confirm('Delete?'))return;await sb.from('recruits').delete().eq('id',id);S.recruits=S.recruits.filter(r=>r.id!==id);render();}
async function addRecruit(){const n=document.getElementById('nr-n').value.trim();if(!n)return;const {data}=await sb.from('recruits').insert({name:n,source:document.getElementById('nr-s').value,date_applied:document.getElementById('nr-d').value,stage:'Applied'}).select().single();if(data)S.recruits.push(data);S.showAddRecruit=false;render();}
async function addReport(){const wk=document.getElementById('rp-wk').value.trim();if(!wk)return;const snap={staff:S.team.length,done:S.tasks.filter(x=>x.status==='Done').length,clients:S.clients.filter(c=>c.status==='Active').length};const {data}=await sb.from('reports').insert({week_label:wk,summary:document.getElementById('rp-sum').value,done_items:document.getElementById('rp-don').value,stuck_items:document.getElementById('rp-stk').value,next_week:document.getElementById('rp-nxt').value,snap}).select().single();if(data){S.reports.unshift(data);S.viewReport=data.id;}S.showAddReport=false;render();}
async function delReport(id){if(!confirm('Delete?'))return;await sb.from('reports').delete().eq('id',id);S.reports=S.reports.filter(r=>r.id!==id);S.viewReport=null;render();}
function genCode(role){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='';for(let i=0;i<8;i++)code+=chars[Math.floor(Math.random()*chars.length)];return`${role.toUpperCase()}-${code}`;}
async function addCode(){const role=document.getElementById('nc-role').value;const label=document.getElementById('nc-label').value;const custom=document.getElementById('nc-code').value.trim();const code=custom||genCode(role);const {data}=await sb.from('invite_codes').insert({code,role,label}).select().single();if(data)S.codes.push(data);S.showAddCode=false;render();}
async function delCode(id){if(!confirm('Delete this code?'))return;await sb.from('invite_codes').delete().eq('id',id);S.codes=S.codes.filter(c=>c.id!==id);render();}
async function changeRole(id,role){if(!confirm(`Change this user's role to ${ROLE_LABELS[role]}?`))return;await sb.from('user_profiles').update({role}).eq('id',id);S.team=S.team.map(m=>m.id===id?{...m,role}:m);render();}

init();
</script>
